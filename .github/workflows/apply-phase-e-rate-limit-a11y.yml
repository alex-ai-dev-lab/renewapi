name: Apply Phase E Rate Limit accessibility fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'qa/aurora-advanced-settings-phase-e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply asserted product fix
        run: python3 .github/apply-phase-e-rate-limit-a11y.py

      - name: Format and verify product file
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/features/system-settings/request-limits/rate-limit-section.tsx
          git diff --check

      - name: Commit fix to PR branch
        run: |
          git config user.name 'Aurora QA'
          git config user.email 'actions@users.noreply.github.com'
          git add web/default/src/features/system-settings/request-limits/rate-limit-section.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix(web): label Rate Limit numeric controls'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
