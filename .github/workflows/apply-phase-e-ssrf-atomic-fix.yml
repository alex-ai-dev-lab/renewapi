name: Apply Phase E SSRF atomic fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'qa/aurora-advanced-settings-phase-e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply asserted SSRF product and QA patches
        run: python3 .github/apply-phase-e-ssrf-atomic-fix.py

      - name: Format and verify touched product files
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bunx prettier --write \
            src/features/system-settings/request-limits/ssrf-section.tsx \
            src/features/system-settings/types.ts
          git diff --check

      - name: Commit fixes to PR branch
        run: |
          git config user.name 'Aurora QA'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            web/default/src/features/system-settings/request-limits/ssrf-section.tsx \
            web/default/src/features/system-settings/types.ts \
            .github/patch-settings-advanced-phase-e.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(web): persist SSRF settings atomically'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
