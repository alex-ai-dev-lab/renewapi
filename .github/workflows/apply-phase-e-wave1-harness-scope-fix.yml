name: Apply Phase E Wave 1 harness scope fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'qa/aurora-advanced-settings-phase-e'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply asserted harness-only fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/patch-settings-advanced-phase-e.py')
          text = path.read_text()
          old = """async function runSsrfWave(context, user) {
            const { page } = await openAdvancedPage("""
          new = """async function runSsrfWave(context, user) {
            const { page, optionMutations } = await openAdvancedPage("""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one SSRF scope target, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit harness fix to PR branch
        run: |
          git config user.name 'Aurora QA'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/patch-settings-advanced-phase-e.py
          git diff --cached --check
          git commit -m 'test: fix SSRF Wave 1 mutation tracker scope'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
