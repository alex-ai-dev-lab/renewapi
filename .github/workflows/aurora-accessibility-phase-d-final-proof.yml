name: Aurora Phase D final proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  accessibility-final-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Install browser accessibility tools for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0 axe-core@4.10.3
          bunx playwright install --with-deps chromium

      - name: Rehydrate deterministic Phase C fixture
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/alex-ai-dev-lab/renewapi/3d91c3fd22fbfae284d48563d5a09ac046a81cd2/.github/aurora-final-visual-qa.mjs \
            -o /tmp/aurora-final-visual-qa.mjs
          for file in generate-aurora-deep-states.py patch-aurora-deep-states-v2.py patch-aurora-deep-states-v3.py patch-aurora-deep-states-v4.py patch-aurora-deep-states-v5.py; do
            curl -fsSL \
              "https://raw.githubusercontent.com/alex-ai-dev-lab/renewapi/262c5989731d9dd91f63e4284df0437ce1057db7/.github/$file" \
              -o "/tmp/$file"
          done
          curl -fsSL \
            https://raw.githubusercontent.com/alex-ai-dev-lab/renewapi/3c195cd61b9a5a3bf3bf93775e327d3c724203dc/.github/patch-aurora-accessibility-phase-d.py \
            -o /tmp/patch-aurora-accessibility-phase-d.py
          python3 /tmp/generate-aurora-deep-states.py
          python3 /tmp/patch-aurora-deep-states-v2.py
          python3 /tmp/patch-aurora-deep-states-v3.py
          python3 /tmp/patch-aurora-deep-states-v4.py
          python3 /tmp/patch-aurora-deep-states-v5.py
          python3 /tmp/patch-aurora-accessibility-phase-d.py
          cp /tmp/aurora-deep-states.mjs web/default/.aurora-accessibility-phase-d.mjs

      - name: Start production preview
        working-directory: web/default
        run: |
          nohup bun run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/aurora-a11y-preview.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/aurora-a11y-preview.log"
          exit 1

      - name: Run P2-strict accessibility and contrast matrix
        working-directory: web/default
        env:
          QA_OUT: ../../qa-artifacts/aurora-accessibility-phase-d
          QA_PRODUCT_HEAD: ${{ github.sha }}
        run: bun .aurora-accessibility-phase-d.mjs

      - name: Show accessibility report
        if: always()
        run: |
          cat qa-artifacts/aurora-accessibility-phase-d/report.json || true
          cat qa-artifacts/aurora-accessibility-phase-d/axe-incomplete.json || true
          cat qa-artifacts/aurora-accessibility-phase-d/console-errors.txt || true
          cat qa-artifacts/aurora-accessibility-phase-d/page-errors.txt || true
          cat qa-artifacts/aurora-accessibility-phase-d/unhandled.txt || true

      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-accessibility-phase-d-final-proof
          path: qa-artifacts/aurora-accessibility-phase-d
          if-no-files-found: error
