name: Aurora Browser Edge Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurora-browser-edge-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply exact browser fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          stats_path = Path('web/default/src/features/dashboard/stats-api.ts')
          stats_text = stats_path.read_text()

          array_hooks = [
              ('useChannelStats', 'ChannelStat'),
              ('useModelStats', 'ModelStat'),
              ('useModelTrendStats', 'TrendPoint'),
              ('useUserStats', 'UserStat'),
              ('useUserTrendStats', 'TrendPoint'),
              ('useChannelUserStats', 'ChannelUserStat'),
              ('useChannelTrendStats', 'TrendPoint'),
          ]

          for index, (function_name, item_type) in enumerate(array_hooks):
              marker = f'export function {function_name}('
              start = stats_text.find(marker)
              if start < 0:
                  raise SystemExit(f'{function_name}: function marker not found')
              end = stats_text.find('\nexport function ', start + len(marker))
              if end < 0:
                  end = len(stats_text)
              block = stats_text[start:end]
              old_type = f'data: {item_type}[]'
              if block.count(old_type) != 1:
                  raise SystemExit(
                      f'{function_name}: expected one {old_type!r}, found {block.count(old_type)}'
                  )
              if block.count('return res.data.data') != 1:
                  raise SystemExit(
                      f'{function_name}: expected one raw stats return, found {block.count("return res.data.data")}'
                  )
              block = block.replace(old_type, f'data: {item_type}[] | null', 1)
              block = block.replace('return res.data.data', 'return res.data.data ?? []', 1)
              stats_text = stats_text[:start] + block + stats_text[end:]

          stats_path.write_text(stats_text)

          replace_once(
              'web/default/src/components/ui/combobox.tsx',
              "          data-slot='combobox-chip-remove'\n        >",
              "          data-slot='combobox-chip-remove'\n          aria-label='Remove item'\n        >",
          )

          replace_once(
              'web/default/src/features/channels/components/editor/channel-editor.tsx',
              "? 'bg-primary/10 text-primary flex w-full items-center rounded-xl px-3 py-2 text-left text-sm font-medium'",
              "? 'bg-primary/10 text-foreground flex w-full items-center rounded-xl px-3 py-2 text-left text-sm font-medium'",
          )
          PY

      - name: Verify default frontend
        working-directory: web/default
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx prettier --write \
            src/features/dashboard/stats-api.ts \
            src/components/ui/combobox.tsx \
            src/features/channels/components/editor/channel-editor.tsx
          bunx eslint \
            src/features/dashboard/stats-api.ts \
            src/components/ui/combobox.tsx \
            src/features/channels/components/editor/channel-editor.tsx
          bun test
          bun run typecheck
          bun run build

      - name: Verify structural contracts
        run: |
          set -euo pipefail
          test "$(grep -Fc 'return res.data.data ?? []' web/default/src/features/dashboard/stats-api.ts)" -eq 7
          grep -Fq "data: ChannelStat[] | null" web/default/src/features/dashboard/stats-api.ts
          grep -Fq "data: ModelStat[] | null" web/default/src/features/dashboard/stats-api.ts
          grep -Fq "data: UserStat[] | null" web/default/src/features/dashboard/stats-api.ts
          grep -Fq "data: ChannelUserStat[] | null" web/default/src/features/dashboard/stats-api.ts
          grep -Fq "aria-label='Remove item'" web/default/src/components/ui/combobox.tsx
          grep -Fq "bg-primary/10 text-foreground flex w-full" web/default/src/features/channels/components/editor/channel-editor.tsx
          git diff --check

      - name: Commit verified fixes and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/aurora-browser-edge-fixes.yml
          git add \
            web/default/src/features/dashboard/stats-api.ts \
            web/default/src/components/ui/combobox.tsx \
            web/default/src/features/channels/components/editor/channel-editor.tsx
          git diff --cached --stat
          git commit -m 'fix(ui): harden empty stats and editor accessibility'
          git push origin HEAD:main
