name: Aurora Phase C revalidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aurora-phase-c-revalidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify frontend engineering gates
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build
          files=(
            src/components/data-table/bulk-actions.tsx
            src/components/data-table/data-table-page.tsx
            src/features/channels/components/channels-aurora-overview.tsx
            src/features/channels/components/channels-table.tsx
            src/features/channels/components/data-table-row-actions.tsx
            src/features/dashboard/aurora-overview-panels.tsx
            src/features/keys/components/api-keys-aurora-overview.tsx
            src/features/keys/components/api-keys-cells.tsx
            src/features/keys/components/api-keys-table.tsx
            src/features/keys/components/data-table-row-actions.tsx
            src/features/models/components/data-table-row-actions.tsx
            src/features/models/components/models-stats.tsx
            src/features/models/components/models-table.tsx
            src/features/usage-logs/components/usage-logs-table.tsx
            src/features/users/components/users-stats.tsx
            src/features/users/components/users-table.tsx
            src/lib/api-errors.ts
            src/lib/api-errors.test.ts
          )
          bunx prettier --check "${files[@]}"

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Reconstruct validated Phase C harness
        run: |
          base=https://raw.githubusercontent.com/alex-ai-dev-lab/renewapi
          curl -fsSL "$base/3d91c3fd22fbfae284d48563d5a09ac046a81cd2/.github/aurora-final-visual-qa.mjs" -o /tmp/aurora-final-visual-qa.mjs
          curl -fsSL "$base/262c5989731d9dd91f63e4284df0437ce1057db7/.github/generate-aurora-deep-states.py" -o /tmp/generate.py
          curl -fsSL "$base/262c5989731d9dd91f63e4284df0437ce1057db7/.github/patch-aurora-deep-states-v2.py" -o /tmp/v2.py
          curl -fsSL "$base/262c5989731d9dd91f63e4284df0437ce1057db7/.github/patch-aurora-deep-states-v3.py" -o /tmp/v3.py
          curl -fsSL "$base/262c5989731d9dd91f63e4284df0437ce1057db7/.github/patch-aurora-deep-states-v4.py" -o /tmp/v4.py
          curl -fsSL "$base/262c5989731d9dd91f63e4284df0437ce1057db7/.github/patch-aurora-deep-states-v5.py" -o /tmp/v5.py
          python3 /tmp/generate.py
          python3 /tmp/v2.py
          python3 /tmp/v3.py
          python3 /tmp/v4.py
          python3 /tmp/v5.py
          cp /tmp/aurora-deep-states.mjs web/default/.aurora-deep-states.mjs

      - name: Start production preview
        working-directory: web/default
        run: |
          nohup bun run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/aurora-preview.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/aurora-preview.log"
          exit 1

      - name: Run P2-strict Phase C matrix
        working-directory: web/default
        env:
          QA_OUT: ../../qa-artifacts/aurora-deep-states-revalidate
          QA_PRODUCT_HEAD: ${{ github.sha }}
        run: bun .aurora-deep-states.mjs

      - name: Show report
        if: always()
        run: |
          cat qa-artifacts/aurora-deep-states-revalidate/report.json || true
          cat qa-artifacts/aurora-deep-states-revalidate/console-errors.txt || true
          cat qa-artifacts/aurora-deep-states-revalidate/page-errors.txt || true
          cat qa-artifacts/aurora-deep-states-revalidate/unhandled.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-deep-states-revalidate
          path: qa-artifacts/aurora-deep-states-revalidate
          if-no-files-found: error
