name: Aurora interaction and accessibility QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-interaction-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install application dependencies
        working-directory: web/default
        run: bun install --frozen-lockfile

      - name: Verify application quality
        working-directory: web/default
        run: |
          bun test
          bun run typecheck
          bun run build

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Start implementation server
        shell: bash
        run: |
          set -euo pipefail
          cd web/default
          bun run preview -- --host 127.0.0.1 --port 4173 >/tmp/aurora-a11y-app.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aurora-a11y-app.log || true
          exit 1

      - name: Build deterministic interaction harness
        working-directory: web/default
        shell: bash
        run: |
          set -euo pipefail
          ref_sha='3d91c3fd22fbfae284d48563d5a09ac046a81cd2'
          curl -fsSL "https://raw.githubusercontent.com/alex-ai-dev-lab/renewapi/${ref_sha}/.github/aurora-final-visual-qa.mjs" -o .aurora-interaction-base.mjs
          python3 ../../.github/generate-aurora-interaction-a11y.py
          python3 ../../.github/patch-aurora-interaction-a11y.py
          python3 ../../.github/patch-aurora-interaction-a11y-v2.py
          test -s .aurora-interaction-a11y.mjs

      - name: Run interaction and accessibility audit
        working-directory: web/default
        env:
          QA_OUT: ../../qa-artifacts
        run: bun .aurora-interaction-a11y.mjs

      - name: Show QA summary
        if: always()
        run: |
          cat qa-artifacts/qa-summary.txt || true
          cat qa-artifacts/issues.json || true

      - name: Upload interaction QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-interaction-a11y-qa
          path: qa-artifacts
          if-no-files-found: error
