name: Aurora Phase C deep-state QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aurora-phase-c-deep-states-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install application dependencies
        working-directory: web/default
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        working-directory: web/default
        run: bun test

      - name: Typecheck frontend
        working-directory: web/default
        run: bun run typecheck

      - name: Build application
        working-directory: web/default
        run: bun run build

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Start implementation preview
        shell: bash
        run: |
          set -euo pipefail
          cd web/default
          bun run preview -- --host 127.0.0.1 --port 4173 >/tmp/aurora-phase-c-app.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aurora-phase-c-app.log || true
          exit 1

      - name: Run deep-state browser QA
        working-directory: web/default
        env:
          QA_OUT: ../../qa-artifacts/phase-c
        run: |
          cp ../../.github/aurora-phase-c-deep-states-qa-v2.mjs ./.aurora-phase-c-deep-states-qa.mjs
          bun ./.aurora-phase-c-deep-states-qa.mjs

      - name: Show QA summary
        if: always()
        run: |
          cat qa-artifacts/phase-c/summary.txt 2>/dev/null || true
          cat qa-artifacts/phase-c/summary.json 2>/dev/null || true

      - name: Upload Phase C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-phase-c-deep-states
          path: qa-artifacts/phase-c
          if-no-files-found: warn
