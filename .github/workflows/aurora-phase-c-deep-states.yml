name: Aurora Phase C deep-state QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aurora-phase-c-deep-states-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Start production preview
        working-directory: web/default
        run: |
          nohup bun run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/aurora-phase-c-preview.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/aurora-phase-c-preview.log"
          exit 1

      - name: Run deep-state browser matrix
        working-directory: web/default
        env:
          QA_OUT: ../../qa-artifacts/phase-c-deep-states
        run: |
          cp ../../.github/aurora-phase-c-deep-states.mjs .aurora-phase-c-deep-states.mjs
          bun .aurora-phase-c-deep-states.mjs

      - name: Show QA summary
        if: always()
        run: |
          cat qa-artifacts/phase-c-deep-states/summary.txt || true
          cat qa-artifacts/phase-c-deep-states/issues.json || true
          cat qa-artifacts/phase-c-deep-states/unhandled.txt || true
          cat qa-artifacts/phase-c-deep-states/console-errors.txt || true

      - name: Upload deep-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-phase-c-deep-states
          path: qa-artifacts/phase-c-deep-states
          if-no-files-found: error
