name: Aurora Phase C final gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aurora-phase-c-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Show exact changed product formatting diff
        working-directory: web/default
        run: |
          files=(
            src/components/data-table/bulk-actions.tsx
            src/components/data-table/data-table-page.tsx
            src/features/channels/components/channels-aurora-overview.tsx
            src/features/channels/components/channels-table.tsx
            src/features/channels/components/data-table-bulk-actions.tsx
            src/features/channels/components/data-table-row-actions.tsx
            src/features/dashboard/aurora-overview-panels.tsx
            src/features/keys/components/api-keys-aurora-overview.tsx
            src/features/keys/components/api-keys-cells.tsx
            src/features/keys/components/api-keys-table.tsx
            src/features/keys/components/data-table-bulk-actions.tsx
            src/features/keys/components/data-table-row-actions.tsx
            src/features/models/components/data-table-bulk-actions.tsx
            src/features/models/components/data-table-row-actions.tsx
            src/features/models/components/models-stats.tsx
            src/features/models/components/models-table.tsx
            src/features/usage-logs/components/usage-logs-table.tsx
            src/features/users/components/users-stats.tsx
            src/features/users/components/users-table.tsx
            src/lib/api-errors.ts
            src/lib/api-errors.test.ts
          )
          bunx prettier --write "${files[@]}"
          git diff -- "${files[@]}"
          exit 1

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Rehydrate validated Phase C harness
        run: |
          curl -fsSL https://raw.githubusercontent.com/alex-ai-dev-lab/renewapi/3d91c3fd22fbfae284d48563d5a09ac046a81cd2/.github/aurora-final-visual-qa.mjs -o /tmp/aurora-final-visual-qa.mjs
          for file in generate-aurora-deep-states.py patch-aurora-deep-states-v2.py patch-aurora-deep-states-v3.py patch-aurora-deep-states-v4.py patch-aurora-deep-states-v5.py; do
            curl -fsSL "https://raw.githubusercontent.com/alex-ai-dev-lab/renewapi/262c5989731d9dd91f63e4284df0437ce1057db7/.github/$file" -o "/tmp/$file"
          done
          python3 /tmp/generate-aurora-deep-states.py
          python3 /tmp/patch-aurora-deep-states-v2.py
          python3 /tmp/patch-aurora-deep-states-v3.py
          python3 /tmp/patch-aurora-deep-states-v4.py
          python3 /tmp/patch-aurora-deep-states-v5.py
          cat > /tmp/patch-aurora-deep-states-v6.py <<'PY'
          from pathlib import Path

          path = Path('/tmp/aurora-deep-states.mjs')
          source = path.read_text()
          marker = 'async function runLateA11yRegression(browser) {'
          if marker not in source:
              raise SystemExit('late a11y marker not found')

          regression = r'''
          async function runModelRegistryTotalRegression(browser) {
            const scenario = {
              name: 'models-registry-total-filter',
              feature: 'models',
              mode: 'normal',
              language: 'en-US',
              theme: 'light',
            }
            const context = await createContext(browser, scenario)
            try {
              const page = await context.newPage()
              page.on('console', (message) => {
                if (message.type() === 'error') {
                  consoleErrors.push({ scenario: scenario.name, text: message.text() })
                }
              })
              page.on('pageerror', (error) => {
                pageErrors.push({
                  scenario: scenario.name,
                  message: error.message,
                  stack: error.stack,
                })
              })
              await page.route('**/api/models/search**', async (route) => {
                const url = new URL(route.request().url())
                requestLog.push(
                  `${scenario.name} ${route.request().method()} ${url.pathname}${url.search} [filtered override]`
                )
                await route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify(
                    ok({
                      items: [models[0]],
                      total: 1,
                      page: 1,
                      page_size: Number(url.searchParams.get('page_size') || 10),
                      vendor_counts: { all: 1, '1': 1 },
                    })
                  ),
                })
              })
              await page.goto(`${APP}${featurePages.models}`, {
                waitUntil: 'domcontentloaded',
              })
              await page.addStyleTag({
                content:
                  '*{animation:none!important;transition:none!important;caret-color:transparent!important}',
              })
              await waitForBaseline(page, 'models')
              await openManagement(page)
              const search = page.getByPlaceholder('Filter by model name...')
              const response = page.waitForResponse(
                (candidate) =>
                  candidate.url().includes('/api/models/search') &&
                  candidate.request().method() === 'GET',
                { timeout: 15000 }
              )
              await search.fill('gpt-5.6')
              await response
              await page
                .waitForFunction(() => document.querySelectorAll('tbody tr').length === 1, null, {
                  timeout: 15000,
                })
                .catch(() => {})
              const headline = page.getByText(/registered models/i).first()
              await headline.waitFor({ state: 'visible', timeout: 15000 })
              const headlineText = await headline.innerText()
              if (!/\b42 registered models\b/i.test(headlineText)) {
                addIssue(
                  'P2',
                  scenario.name,
                  'model registry headline adopted the filtered result count',
                  { expectedTotal: 42, filteredTotal: 1, headlineText }
                )
              }
              await snapshot(page, scenario)
              await auditViewport(page, scenario)
            } finally {
              await context.close()
            }
          }

          '''
          source = source.replace(marker, regression + marker, 1)
          call_marker = '  await runModelEdit(browser)\n  await runLateA11yRegression(browser)'
          if call_marker not in source:
              raise SystemExit('model edit call marker not found')
          source = source.replace(
              call_marker,
              '  await runModelEdit(browser)\n  await runModelRegistryTotalRegression(browser)\n  await runLateA11yRegression(browser)',
              1,
          )
          path.write_text(source)
          PY
          python3 /tmp/patch-aurora-deep-states-v6.py
          cp /tmp/aurora-deep-states.mjs web/default/.aurora-deep-states.mjs

      - name: Start production preview
        working-directory: web/default
        run: |
          nohup bun run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/aurora-phase-c-final-preview.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/aurora-phase-c-final-preview.log"
          exit 1

      - name: Run P2-strict browser matrix
        working-directory: web/default
        env:
          QA_OUT: ../../qa-artifacts/aurora-phase-c-final
          QA_PRODUCT_HEAD: ${{ github.sha }}
        run: bun .aurora-deep-states.mjs

      - name: Show final report
        if: always()
        run: |
          cat qa-artifacts/aurora-phase-c-final/report.json || true
          cat qa-artifacts/aurora-phase-c-final/console-errors.txt || true
          cat qa-artifacts/aurora-phase-c-final/page-errors.txt || true
          cat qa-artifacts/aurora-phase-c-final/unhandled.txt || true

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-phase-c-final
          path: qa-artifacts/aurora-phase-c-final
          if-no-files-found: error
