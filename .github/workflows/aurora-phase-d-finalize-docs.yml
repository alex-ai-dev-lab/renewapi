name: Finalize Aurora Phase D docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-docs:
    if: github.head_ref == 'qa/aurora-accessibility-phase-d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch final Phase D evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match in {path}: {old!r}; found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          qa = 'docs/aurora-accessibility-phase-d-qa.md'
          replace_once(qa,
              '> Final validated source head: `f07f6423abb0c524cb07b6d397cf146c94a3186a`  ',
              '> Final validated product head: `054378370c727b36e613c8c54cd7c85b4f9955b9`  ')
          replace_once(qa,
              '> Validated PR merge tree: `7ceb2b31d07630e3a7fad7dda82086cb92e34f6b`  ',
              '> Validated PR merge tree: `f68be6c909dfe38ff0d15e46f6d811f86ceed996`  ')
          replace_once(qa,
              '> GitHub Actions run: `32644742739`  ',
              '> GitHub Actions final proof run: `32645510077`  ')
          replace_once(qa,
              '> Artifact: `aurora-accessibility-phase-d` / id `9494583726`  ',
              '> Artifact: `aurora-accessibility-phase-d-final-proof` / id `9494793377`  ')
          replace_once(qa,
              '> Artifact digest: `sha256:3b7d60938088aa5fa416ec180d14ea1959139a7566f66a08a6206418299af9e0`',
              '> Artifact digest: `sha256:c29272a0b22e45a6452934cfe95c21dfd8531173fb3bc3a6334c6d0e84d19be0`')
          replace_once(qa,
              '- `text-[#7C5CBF]` → `var(--primary)`',
              '- `text-[#7C5CBF]` → `var(--info)`')

          tracker = 'docs/aurora-bento-v2-progress.md'
          replace_once(tracker,
              '> Phase D final validated source head：`f07f6423abb0c524cb07b6d397cf146c94a3186a`  ',
              '> Phase D final validated product head：`054378370c727b36e613c8c54cd7c85b4f9955b9`  ')
          replace_once(tracker,
              '> Phase D final validated PR merge tree：`7ceb2b31d07630e3a7fad7dda82086cb92e34f6b`',
              '> Phase D final validated PR merge tree：`f68be6c909dfe38ff0d15e46f6d811f86ceed996`')
          replace_once(tracker,
              '| Phase D accessibility final | `32644742739` | ✅ axe violations=0；P0/P1/P2=0；14/14 high-DPI no overflow；28 ARIA snapshots |',
              '| Phase D accessibility final proof | `32645510077` | ✅ axe violations=0；P0/P1/P2=0；14/14 high-DPI no overflow；28 ARIA snapshots |')
          replace_once(tracker,
              '- Phase D final：id `9494583726` / digest `sha256:3b7d60938088aa5fa416ec180d14ea1959139a7566f66a08a6206418299af9e0`',
              '- Phase D final proof：`aurora-accessibility-phase-d-final-proof` / id `9494793377` / digest `sha256:c29272a0b22e45a6452934cfe95c21dfd8531173fb3bc3a6334c6d0e84d19be0`')
          replace_once(tracker,
              '最终 run `32644742739`：自动化 gate 全绿。详细证据见 `docs/aurora-accessibility-phase-d-qa.md`。',
              '最终 proof run `32645510077`：自动化 gate 全绿，并验证 `#7C5CBF → --info` 的最终 contrast 修正。详细证据见 `docs/aurora-accessibility-phase-d-qa.md`。')
          PY

      - name: Commit durable docs and remove this workflow
        run: |
          git config user.name 'Aurora QA'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/aurora-phase-d-finalize-docs.yml
          git add docs/aurora-accessibility-phase-d-qa.md docs/aurora-bento-v2-progress.md
          git commit -m 'docs: finalize Aurora Phase D evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
