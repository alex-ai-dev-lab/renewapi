name: Aurora QA Hardening Apply

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aurora-qa-hardening-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden Secondary Surfaces browser gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/aurora-secondary-surfaces.mjs')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "  ['terms-of-service', '/terms-of-service'],\n",
              "  ['user-agreement', '/user-agreement'],\n",
              'real user agreement route',
          )

          replace_once(
              """  ['redemption-codes', '/redemption-codes'],\n]\n""",
              """  ['redemption-codes', '/redemption-codes'],\n  ['channels', '/channels'],\n  ['usage-logs', '/usage-logs/common'],\n  ['system-settings', '/system-settings'],\n  ['channel-create', '/channels/new'],\n]\n""",
              'secondary admin surfaces',
          )

          replace_once(
              """async function waitForSurface(page) {\n  await page.locator('body').waitFor({ state: 'visible', timeout: 20000 })\n  await sleep(900)\n  await page.evaluate(() => document.fonts?.ready)\n}\n""",
              """async function waitForSurface(page) {\n  await page.locator('body').waitFor({ state: 'visible', timeout: 20000 })\n  await page\n    .locator('[data-qa-route-id]')\n    .waitFor({ state: 'attached', timeout: 20000 })\n  await sleep(900)\n  await page.evaluate(() => document.fonts?.ready)\n}\n""",
              'route identity wait',
          )

          marker = """    if (!response || response.status() >= 500) {\n      failures.push({\n        label,\n        type: 'navigation-status',\n        status: response?.status() ?? null,\n        currentURL,\n      })\n    }\n\n"""
          assertions = """    const routeIdentity = await page\n      .locator('[data-qa-route-id]')\n      .first()\n      .getAttribute('data-qa-route-id')\n    if (!routeIdentity) {\n      failures.push({ label, type: 'missing-route-identity', currentURL })\n    }\n\n    const notFoundCount = await page\n      .locator('[data-page-state=\"not-found\"]')\n      .count()\n    if (id !== 'error-404' && notFoundCount > 0) {\n      failures.push({\n        label,\n        type: 'unexpected-not-found-state',\n        routeIdentity,\n        currentURL,\n      })\n    }\n\n    if (id === 'channel-create') {\n      const editorPageCount = await page\n        .locator('[data-ui=\"channel-editor-page\"]')\n        .count()\n      if (editorPageCount === 0) {\n        failures.push({\n          label,\n          type: 'channel-editor-page-missing',\n          routeIdentity,\n          currentURL,\n        })\n      }\n      const sheetCount = await page.locator('[data-slot=\"sheet-content\"]').count()\n      if (sheetCount > 0) {\n        failures.push({ label, type: 'channel-editor-rendered-as-sheet' })\n      }\n    }\n\n    if (\n      viewportName === 'desktop' &&\n      (id === 'channels' || id === 'usage-logs')\n    ) {\n      const pageModeCount = await page\n        .locator('[data-ui=\"data-table-page\"][data-scroll-mode=\"page\"]')\n        .count()\n      if (pageModeCount === 0) {\n        failures.push({ label, type: 'data-table-page-scroll-contract-missing' })\n      }\n      const tableScroll = page.locator('[data-ui=\"data-table-scroll\"]').first()\n      if ((await tableScroll.count()) > 0) {\n        const tableScrollMetrics = await tableScroll.evaluate((element) => ({\n          clientHeight: element.clientHeight,\n          scrollHeight: element.scrollHeight,\n          overflowY: getComputedStyle(element).overflowY,\n          maxHeight: getComputedStyle(element).maxHeight,\n        }))\n        if (\n          tableScrollMetrics.scrollHeight > tableScrollMetrics.clientHeight + 1 ||\n          tableScrollMetrics.overflowY === 'auto' ||\n          tableScrollMetrics.overflowY === 'scroll' ||\n          tableScrollMetrics.maxHeight !== 'none'\n        ) {\n          failures.push({\n            label,\n            type: 'unexpected-data-table-vertical-scroll',\n            tableScrollMetrics,\n          })\n        }\n      }\n    }\n\n"""
          replace_once(marker, marker + assertions, 'route identity assertions')

          replace_once(
              """      authRequired,\n      overflow,\n""",
              """      authRequired,\n      routeIdentity,\n      notFoundCount,\n      overflow,\n""",
              'record route identity evidence',
          )

          path.write_text(text)
          PY
          node --check .github/aurora-secondary-surfaces.mjs
          grep -q "user-agreement.*user-agreement" .github/aurora-secondary-surfaces.mjs
          ! grep -q 'terms-of-service' .github/aurora-secondary-surfaces.mjs
          grep -q 'unexpected-not-found-state' .github/aurora-secondary-surfaces.mjs
          grep -q 'channel-editor-page-missing' .github/aurora-secondary-surfaces.mjs
          grep -q 'unexpected-data-table-vertical-scroll' .github/aurora-secondary-surfaces.mjs

      - name: Commit hardened gate and remove apply workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/aurora-qa-hardening-apply.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(ui): harden Aurora route and scroll QA'
          git push origin HEAD:main
