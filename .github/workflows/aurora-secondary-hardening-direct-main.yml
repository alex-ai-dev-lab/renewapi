name: Aurora secondary hardening direct main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aurora-secondary-hardening-direct-main.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair secondary surface control names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              p.write_text(text.replace(old, new))

          replace(
              'web/default/src/features/pricing/components/pricing-toolbar.tsx',
              "            aria-pressed={isActive}\n            className={cn(",
              "            aria-pressed={isActive}\n            aria-label={option.label ?? option.tooltip}\n            className={cn(",
          )
          replace(
              'web/default/src/features/profile/components/language-preferences-card.tsx',
              "            <SelectTrigger className='w-full sm:w-48'>",
              "            <SelectTrigger\n              className='w-full sm:w-48'\n              aria-label={t('Interface Language')}\n            >",
          )
          replace(
              'web/default/src/features/wallet/components/affiliate-rewards-card.tsx',
              "          <Input\n            value={affiliateLink}\n            readOnly\n            className='border-muted bg-background/70 h-9 min-w-0 flex-1 font-mono text-xs'",
              "          <Input\n            value={affiliateLink}\n            readOnly\n            aria-label={t('Referral link')}\n            className='border-muted bg-background/70 h-9 min-w-0 flex-1 font-mono text-xs'",
          )
          replace(
              'web/default/src/components/model-group-selector.tsx',
              "    disabled={isDisabled}\n    className={cn(",
              "    disabled={isDisabled}\n    aria-label={currentLabel}\n    className={cn(",
              count=2,
          )
          PY
          git add \
            web/default/src/features/pricing/components/pricing-toolbar.tsx \
            web/default/src/features/profile/components/language-preferences-card.tsx \
            web/default/src/features/wallet/components/affiliate-rewards-card.tsx \
            web/default/src/components/model-group-selector.tsx
          git commit -m "fix(web): repair secondary surface control names"

      - name: Harden secondary surface contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              if actual == 0:
                  raise SystemExit(f"{path}: no matches for {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              'web/default/src/features/profile/components/profile-header.tsx',
              "bg-primary/10 text-primary rounded-xl",
              "bg-primary/10 text-foreground rounded-xl",
              1,
          )
          replace(
              'web/default/src/features/profile/components/profile-header.tsx',
              'text-muted-foreground/60',
              'text-muted-foreground',
              2,
          )
          replace(
              'web/default/src/features/wallet/components/wallet-stats-card.tsx',
              'text-muted-foreground/60',
              'text-muted-foreground',
              2,
          )
          replace(
              'web/default/src/features/rankings/components/models-section.tsx',
              'text-muted-foreground/80',
              'text-muted-foreground',
              4,
          )
          replace(
              'web/default/src/features/rankings/components/market-share-section.tsx',
              'text-muted-foreground/80',
              'text-muted-foreground',
              5,
          )
          PY
          git add \
            web/default/src/features/profile/components/profile-header.tsx \
            web/default/src/features/wallet/components/wallet-stats-card.tsx \
            web/default/src/features/rankings/components/models-section.tsx \
            web/default/src/features/rankings/components/market-share-section.tsx
          git commit -m "style(web): harden secondary surface contrast"

      - name: Harden public mobile navigation accessibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/default/src/components/layout/components/public-header.tsx')
          text = p.read_text()
          old = "            : 'pointer-events-none opacity-0'"
          new = "            : 'pointer-events-none invisible opacity-0'"
          if text.count(old) != 1:
              raise SystemExit(f"public-header.tsx: expected one closed navigation class, found {text.count(old)}")
          p.write_text(text.replace(old, new))
          PY
          git add web/default/src/components/layout/components/public-header.tsx
          git commit -m "fix(web): harden mobile public navigation accessibility"

      - name: Push hardening commits to main
        run: git push origin HEAD:main
