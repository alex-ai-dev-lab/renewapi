name: Aurora v2.1 Channel Editor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aurora-v21-channel-editor.yml'

permissions:
  contents: write

concurrency:
  group: aurora-v21-channel-editor
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Migrate channel editor to workspace routes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('web/default/src')
          old = root / 'features/channels/components/drawers/channel-mutate-drawer.tsx'
          editor_dir = root / 'features/channels/components/editor'
          editor_dir.mkdir(parents=True, exist_ok=True)
          new = editor_dir / 'channel-editor-page.tsx'
          if not old.exists():
              raise SystemExit(f'missing source editor: {old}')
          text = old.read_text()

          def replace_once(s, old_text, new_text, label):
              count = s.count(old_text)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return s.replace(old_text, new_text, 1)

          text = replace_once(
              text,
              "import { useQueryClient } from '@tanstack/react-query'\n",
              "import { useQueryClient } from '@tanstack/react-query'\nimport { useBlocker } from '@tanstack/react-router'\n",
              'router blocker import',
          )
          text = replace_once(
              text,
              "import {\n  Sheet,\n  SheetClose,\n  SheetContent,\n  SheetDescription,\n  SheetFooter,\n  SheetHeader,\n  SheetTitle,\n} from '@/components/ui/sheet'\n",
              '',
              'sheet imports',
          )
          text = replace_once(
              text,
              "import {\n  sideDrawerContentClassName,\n  sideDrawerFooterClassName,\n  sideDrawerFormClassName,\n  sideDrawerHeaderClassName,\n  sideDrawerSectionClassName,\n  sideDrawerSwitchItemClassName,\n} from '@/components/drawer-layout'\n",
              "import {\n  sideDrawerSectionClassName,\n  sideDrawerSwitchItemClassName,\n} from '@/components/drawer-layout'\n",
              'drawer layout imports',
          )
          text = replace_once(
              text,
              "import { useChannels } from '../channels-provider'\n",
              '',
              'channels context import',
          )
          text = replace_once(
              text,
              "} from './sections'\n",
              "} from '../drawers/sections'\n",
              'section import path',
          )
          text = replace_once(
              text,
              "type ChannelMutateDrawerProps = {\n  open: boolean\n  onOpenChange: (open: boolean) => void\n  currentRow?: Channel | null\n}\n",
              "type ChannelEditorPageProps = {\n  channelId?: number | null\n  onNavigateBack: () => void\n}\n",
              'editor props',
          )
          text = replace_once(
              text,
              "export function ChannelMutateDrawer({\n  open,\n  onOpenChange,\n  currentRow,\n}: ChannelMutateDrawerProps) {\n  const { t } = useTranslation()\n  const queryClient = useQueryClient()\n  const { setOpen } = useChannels()\n",
              "export function ChannelEditorPage({\n  channelId: requestedChannelId,\n  onNavigateBack,\n}: ChannelEditorPageProps) {\n  const { t } = useTranslation()\n  const queryClient = useQueryClient()\n  const open = true\n  const currentRow = useMemo<Channel | null>(\n    () =>\n      requestedChannelId\n        ? ({ id: requestedChannelId } as Channel)\n        : null,\n    [requestedChannelId]\n  )\n",
              'component signature',
          )
          text = replace_once(
              text,
              "  useEffect(() => {\n    if (!open) {\n      resetDoubaoApiUnlock()\n    }\n  }, [open, resetDoubaoApiUnlock])\n",
              "  useEffect(() => {\n    resetDoubaoApiUnlock()\n  }, [channelId, resetDoubaoApiUnlock])\n",
              'doubao reset effect',
          )
          text = replace_once(
              text,
              "  // Handle successful submission\n  const handleSuccess = useCallback(() => {\n    queryClient.invalidateQueries({ queryKey: channelsQueryKeys.lists() })\n    if (channelId) {\n      queryClient.invalidateQueries({\n        queryKey: channelsQueryKeys.detail(channelId),\n      })\n    }\n    onOpenChange(false)\n    setOpen(null)\n  }, [channelId, queryClient, onOpenChange, setOpen])\n",
              "  // Handle successful submission\n  const handleSuccess = useCallback(() => {\n    queryClient.invalidateQueries({ queryKey: channelsQueryKeys.lists() })\n    if (channelId) {\n      queryClient.invalidateQueries({\n        queryKey: channelsQueryKeys.detail(channelId),\n      })\n    }\n    form.reset(form.getValues())\n    if (!isEditing) {\n      onNavigateBack()\n    }\n  }, [channelId, form, isEditing, onNavigateBack, queryClient])\n",
              'success behavior',
          )
          text = replace_once(
              text,
              "  const isSubmitting = channelMutation.isPending\n\n  // Submit handler\n",
              "  const isSubmitting = channelMutation.isPending\n\n  useBlocker({\n    shouldBlockFn: () => {\n      if (!form.formState.isDirty || isSubmitting) return false\n      return !window.confirm(\n        t('You have unsaved changes. Leave without saving?')\n      )\n    },\n    enableBeforeUnload: form.formState.isDirty && !isSubmitting,\n  })\n\n  // Submit handler\n",
              'unsaved changes blocker',
          )
          old_open_change = """  const handleOpenChange = useCallback(
    (nextOpen: boolean) => {
      onOpenChange(nextOpen)
      if (!nextOpen) {
        form.reset(CHANNEL_FORM_DEFAULT_VALUES)
        initializedFormTargetRef.current = null
        resetCodexCredential()
        resetDoubaoApiUnlock()
      }
    },
    [onOpenChange, form, resetCodexCredential, resetDoubaoApiUnlock]
  )

"""
          text = replace_once(text, old_open_change, '', 'drawer open handler')
          text = text.replace(
              "Close this drawer and try again from the channel list.",
              "Return to the channel list and try again.",
          )

          old_start = """  return (
    <>
      <Sheet open={open} onOpenChange={handleOpenChange}>
        <SheetContent className={sideDrawerContentClassName('sm:max-w-3xl')}>
          <SheetHeader className={sideDrawerHeaderClassName()}>
            <SheetTitle className='flex items-center gap-2'>
              {getLobeIcon(
                `${getChannelTypeIcon(currentType)}.Color`,
                18
              )}
              {isEditing ? t('Update Channel') : t('Add Channel')}
              {isEditing && channelId && (
                <Badge variant='outline'>#{channelId}</Badge>
              )}
            </SheetTitle>
            <SheetDescription>
              {isEditing
                ? t(
                    'Update channel configuration. Please save after completing the changes.'
                  )
                : t(
                    'Add a new channel by providing all necessary configuration details.'
                  )}
            </SheetDescription>
          </SheetHeader>

          <Form {...form}>
            <form
              id='channel-form'
              onSubmit={form.handleSubmit(onSubmit)}
              className={sideDrawerFormClassName('gap-5')}
            >
"""
          new_start = """  return (
    <>
      <div className='mx-auto w-full max-w-[1240px] px-4 pt-6 pb-32 sm:px-6 lg:px-8'>
        <div className='lg:grid lg:grid-cols-[220px_minmax(0,1fr)] lg:gap-6'>
          <aside className='mb-4 lg:sticky lg:top-24 lg:mb-0 lg:self-start'>
            <nav
              aria-label={t('Channel editor sections')}
              className='glass-tile flex gap-1 overflow-x-auto p-2 lg:flex-col'
            >
              {[
                ['channel-basic', t('Basic Information')],
                ['channel-auth', t('Authentication')],
                ['channel-api', t('API Access')],
                ['channel-models', t('Models')],
                ['channel-endpoints', t('Model Endpoints')],
                ['channel-advanced', t('Advanced Settings')],
              ].map(([id, label]) => (
                <button
                  key={id}
                  type='button'
                  className='text-muted-foreground hover:bg-muted/60 hover:text-foreground rounded-xl px-3 py-2 text-start text-sm font-medium whitespace-nowrap transition-colors'
                  onClick={() => {
                    if (id === 'channel-advanced') {
                      handleAdvancedSettingsOpenChange(true)
                    }
                    window.requestAnimationFrame(() => {
                      document
                        .getElementById(id)
                        ?.scrollIntoView({ behavior: 'smooth', block: 'start' })
                    })
                  }}
                >
                  {label}
                </button>
              ))}
            </nav>
          </aside>

          <div className='min-w-0'>
            <div className='glass-tile mb-5 px-5 py-4 sm:px-6'>
              <div className='mb-3'>
                <Button
                  type='button'
                  variant='ghost'
                  size='sm'
                  onClick={onNavigateBack}
                >
                  {t('Back to Channels')}
                </Button>
              </div>
              <div className='flex items-center gap-2 text-base font-semibold'>
                {getLobeIcon(
                  `${getChannelTypeIcon(currentType)}.Color`,
                  18
                )}
                {isEditing ? t('Update Channel') : t('Add Channel')}
                {isEditing && channelId && (
                  <Badge variant='outline'>#{channelId}</Badge>
                )}
              </div>
              <p className='text-muted-foreground mt-1 text-sm'>
                {isEditing
                  ? t(
                      'Update channel configuration. Please save after completing the changes.'
                    )
                  : t(
                      'Add a new channel by providing all necessary configuration details.'
                    )}
              </p>
            </div>

            <Form {...form}>
              <form
                id='channel-form'
                onSubmit={form.handleSubmit(onSubmit)}
                className='flex min-w-0 flex-col gap-5'
              >
"""
          text = replace_once(text, old_start, new_start, 'page shell start')

          old_footer = """          <SheetFooter className={sideDrawerFooterClassName()}>
            <SheetClose
              render={<Button variant='outline' disabled={isSubmitting} />}
            >
              {t('Cancel')}
            </SheetClose>
            <Button
              form='channel-form'
              type='submit'
              disabled={
                isSubmitting ||
                isChannelDetailLoading ||
                isChannelDetailUnavailable
              }
            >
              {isSubmitting && (
                <Loader2 className='mr-2 h-4 w-4 animate-spin' />
              )}
              {isEditing ? t('Update Channel') : t('Save changes')}
            </Button>
          </SheetFooter>
        </SheetContent>
      </Sheet>
"""
          new_footer = """            <div className='glass-tile sticky bottom-24 z-20 mt-5 flex flex-wrap items-center justify-end gap-2 px-4 py-3'>
              <Button
                type='button'
                variant='outline'
                disabled={isSubmitting}
                onClick={onNavigateBack}
              >
                {t('Cancel')}
              </Button>
              <Button
                form='channel-form'
                type='submit'
                disabled={
                  isSubmitting ||
                  isChannelDetailLoading ||
                  isChannelDetailUnavailable
                }
              >
                {isSubmitting && (
                  <Loader2 className='mr-2 h-4 w-4 animate-spin' />
                )}
                {isEditing ? t('Update Channel') : t('Save changes')}
              </Button>
            </div>
          </div>
        </div>
      </div>
"""
          text = replace_once(text, old_footer, new_footer, 'page shell footer')

          anchors = {
              'ChannelBasicSection': 'channel-basic',
              'ChannelAuthSection': 'channel-auth',
              'ChannelApiAccessSection': 'channel-api',
              'ChannelModelsSection': 'channel-models',
              'ChannelModelEndpointsSection': 'channel-endpoints',
              'ChannelAdvancedSection': 'channel-advanced',
          }
          for component, anchor in anchors.items():
              pattern = re.compile(rf'^(\s*)<{component}(?=[ >])', re.MULTILINE)
              text, count = pattern.subn(
                  rf"\1<span id='{anchor}' className='block scroll-mt-28' />\n\1<{component}",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'anchor {component}: expected 1 JSX match, got {count}')

          if '<Sheet' in text or 'SheetContent' in text or 'ChannelMutateDrawer' in text:
              raise SystemExit('drawer presentation tokens remain in migrated page')
          new.write_text(text)
          old.unlink()

          old_test = root / 'features/channels/components/drawers/channel-mutate-drawer.test.tsx'
          if old_test.exists():
              old_test.rename(editor_dir / 'channel-editor-page.test.tsx')

          def edit(path, edits):
              p = root / path
              s = p.read_text()
              for old_text, new_text, label in edits:
                  s = replace_once(s, old_text, new_text, f'{path}: {label}')
              p.write_text(s)

          edit(
              'features/channels/components/channels-primary-buttons.tsx',
              [
                  (
                      "import { useQueryClient } from '@tanstack/react-query'\n",
                      "import { useQueryClient } from '@tanstack/react-query'\nimport { useNavigate } from '@tanstack/react-router'\n",
                      'navigate import',
                  ),
                  (
                      "  const {\n    setOpen,\n    setCurrentRow,\n    enableTagMode,\n",
                      "  const navigate = useNavigate()\n  const {\n    enableTagMode,\n",
                      'provider destructure',
                  ),
                  (
                      "            onClick={() => {\n              setCurrentRow(null)\n              setOpen('create-channel')\n            }}\n",
                      "            onClick={() => navigate({ to: '/channels/new' })}\n",
                      'create navigation',
                  ),
              ],
          )

          edit(
              'features/channels/components/data-table-row-actions.tsx',
              [
                  (
                      "import { useQueryClient } from '@tanstack/react-query'\n",
                      "import { useQueryClient } from '@tanstack/react-query'\nimport { useNavigate } from '@tanstack/react-router'\n",
                      'navigate import',
                  ),
                  (
                      "  const { t } = useTranslation()\n  const channel = row.original\n",
                      "  const { t } = useTranslation()\n  const navigate = useNavigate()\n  const channel = row.original\n",
                      'navigate hook',
                  ),
                  (
                      "  const handleEdit = () => {\n    setCurrentRow(channel)\n    setOpen('update-channel')\n  }\n",
                      "  const handleEdit = () => {\n    navigate({\n      to: '/channels/$channelId/edit',\n      params: { channelId: String(channel.id) },\n    })\n  }\n",
                      'edit navigation',
                  ),
              ],
          )

          provider = root / 'features/channels/components/channels-provider.tsx'
          s = provider.read_text()
          for token in ["  | 'create-channel'\n", "  | 'update-channel'\n"]:
              if s.count(token) != 1:
                  raise SystemExit(f'provider dialog token mismatch: {token!r}')
              s = s.replace(token, '', 1)
          provider.write_text(s)

          dialogs = root / 'features/channels/components/channels-dialogs.tsx'
          s = dialogs.read_text()
          s = replace_once(
              s,
              "import { ChannelMutateDrawer } from './drawers/channel-mutate-drawer'\n",
              '',
              'dialogs editor import',
          )
          s = replace_once(
              s,
              """      {/* Channel Create/Update Drawer */}
      <ChannelMutateDrawer
        open={open === 'create-channel' || open === 'update-channel'}
        onOpenChange={(v) => !v && setOpen(null)}
        currentRow={open === 'update-channel' ? currentRow : null}
      />

""",
              '',
              'dialogs editor render',
          )
          dialogs.write_text(s)

          route_header = """/*
Copyright (C) 2023-2026 QuantumNous

This program is free software: you can redistribute it and/or modify
it under the terms of the GNU Affero General Public License as
published by the Free Software Foundation, either version 3 of the
License, or (at your option) any later version.

This program is distributed in the hope that it will be useful,
but WITHOUT ANY WARRANTY; without even the implied warranty of
MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the
GNU Affero General Public License for more details.

You should have received a copy of the GNU Affero General Public License
along with this program. If not, see <https://www.gnu.org/licenses/>.

For commercial licensing, please contact support@quantumnous.com
*/
"""
          channels_routes = root / 'routes/_authenticated/channels'
          (channels_routes / '$channelId').mkdir(parents=True, exist_ok=True)
          (channels_routes / 'new.tsx').write_text(route_header + """import { createFileRoute, redirect } from '@tanstack/react-router'
import { useAuthStore } from '@/stores/auth-store'
import { ROLE } from '@/lib/roles'

export const Route = createFileRoute('/_authenticated/channels/new')({
  beforeLoad: () => {
    const { auth } = useAuthStore.getState()
    if (!auth.user || auth.user.role < ROLE.ADMIN) {
      throw redirect({ to: '/403' })
    }
  },
})
""")
          (channels_routes / 'new.lazy.tsx').write_text(route_header + """import { createLazyFileRoute, useNavigate } from '@tanstack/react-router'
import { ChannelEditorPage } from '@/features/channels/components/editor/channel-editor-page'

export const Route = createLazyFileRoute('/_authenticated/channels/new')({
  component: ChannelCreatePage,
})

function ChannelCreatePage() {
  const navigate = useNavigate()
  return (
    <ChannelEditorPage
      onNavigateBack={() => navigate({ to: '/channels' })}
    />
  )
}
""")
          (channels_routes / '$channelId/edit.tsx').write_text(route_header + """import { createFileRoute, redirect } from '@tanstack/react-router'
import { useAuthStore } from '@/stores/auth-store'
import { ROLE } from '@/lib/roles'

export const Route = createFileRoute('/_authenticated/channels/$channelId/edit')({
  beforeLoad: () => {
    const { auth } = useAuthStore.getState()
    if (!auth.user || auth.user.role < ROLE.ADMIN) {
      throw redirect({ to: '/403' })
    }
  },
})
""")
          (channels_routes / '$channelId/edit.lazy.tsx').write_text(route_header + """import { createLazyFileRoute, useNavigate } from '@tanstack/react-router'
import { ChannelEditorPage } from '@/features/channels/components/editor/channel-editor-page'
import { NotFoundError } from '@/features/errors/not-found-error'

export const Route = createLazyFileRoute(
  '/_authenticated/channels/$channelId/edit'
)({
  component: ChannelEditPage,
})

function ChannelEditPage() {
  const { channelId } = Route.useParams()
  const navigate = useNavigate()
  const numericChannelId = Number(channelId)

  if (!Number.isInteger(numericChannelId) || numericChannelId <= 0) {
    return <NotFoundError />
  }

  return (
    <ChannelEditorPage
      channelId={numericChannelId}
      onNavigateBack={() => navigate({ to: '/channels' })}
    />
  )
}
""")
          PY

          git diff --stat

      - name: Install frontend dependencies
        working-directory: web/default
        run: bun install --frozen-lockfile

      - name: Generate route tree
        working-directory: web/default
        run: bun run build

      - name: Format touched frontend files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACM -- web/default)
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do rel+=("${file#web/default/}"); done
            bun x prettier --write "${rel[@]}"
          fi

      - name: Typecheck
        working-directory: web/default
        run: bun run typecheck

      - name: Unit tests
        working-directory: web/default
        run: bun test

      - name: Lint touched files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACM -- 'web/default/src/**/*.ts' 'web/default/src/**/*.tsx')
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do rel+=("${file#web/default/}"); done
            bun x eslint "${rel[@]}"
          fi

      - name: Format touched files check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACM -- web/default)
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do rel+=("${file#web/default/}"); done
            bun x prettier --check "${rel[@]}"
          fi

      - name: Production build
        working-directory: web/default
        run: bun run build:check

      - name: Dead-code regression check
        working-directory: web/default
        shell: bash
        run: |
          set +e
          bun run knip > ../../knip-channel-editor.txt 2>&1
          code=$?
          cat ../../knip-channel-editor.txt
          if (( code == 0 )); then exit 0; fi
          unexpected=0
          while IFS= read -r file; do
            rel="${file#web/default/}"
            if grep -Fq "$rel" ../../knip-channel-editor.txt; then
              echo "knip reports a touched runtime file: $rel"
              unexpected=1
            fi
          done < <(git diff --name-only --diff-filter=ACM -- 'web/default/src/**')
          exit "$unexpected"

      - name: Verify channel editor invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f web/default/src/features/channels/components/editor/channel-editor-page.tsx
          test ! -f web/default/src/features/channels/components/drawers/channel-mutate-drawer.tsx
          grep -q '/channels/new' web/default/src/routeTree.gen.ts
          grep -q '/channels/\$channelId/edit' web/default/src/routeTree.gen.ts
          ! grep -q 'ChannelMutateDrawer' web/default/src/features/channels/components/channels-dialogs.tsx
          ! grep -q "'create-channel'" web/default/src/features/channels/components/channels-provider.tsx
          ! grep -q "'update-channel'" web/default/src/features/channels/components/channels-provider.tsx
          ! grep -q '<Sheet' web/default/src/features/channels/components/editor/channel-editor-page.tsx
          grep -q "createLazyFileRoute('/_authenticated/channels/new')" web/default/src/routes/_authenticated/channels/new.lazy.tsx
          grep -q 'createLazyFileRoute(' web/default/src/routes/_authenticated/channels/\$channelId/edit.lazy.tsx

      - name: Commit verified channel editor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/aurora-v21-channel-editor.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(channels): move channel editing to workspace routes"
          git push origin HEAD:main
