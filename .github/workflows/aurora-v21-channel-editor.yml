name: Aurora v2.1 Channel Editor

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/aurora-v21-channel-editor.py'
      - '.github/workflows/aurora-v21-channel-editor.yml'

permissions:
  contents: write

concurrency:
  group: aurora-v21-channel-editor
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Relax legacy footer matcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/aurora-v21-channel-editor.py')
          s = p.read_text()
          old = r'''r"\n          <SheetFooter className=\{sideDrawerFooterClassName\(\)\}>[\s\S]*?</SheetFooter>\n"'''
          new = r'''r"<SheetFooter[^>]*>[\s\S]*?</SheetFooter>"'''
          if old not in s:
              raise SystemExit('legacy footer matcher not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Normalize legacy drawer close handler
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("web/default/src/features/channels/components/drawers/channel-mutate-drawer.tsx"); s=p.read_text(); old="  // Handle drawer close\n  const handleOpenChange = useCallback(\n    (v: boolean) => {\n      onOpenChange(v)\n      if (!v) {\n        initializedFormTargetRef.current = null\n        setEditingConfigVersion(undefined)\n        form.reset(CHANNEL_FORM_DEFAULT_VALUES)\n        setAdvancedSettingsOpen(false)\n        resetCodexCredential()\n      }\n    },\n    [onOpenChange, form, resetCodexCredential]\n  )\n\n"; new="  const handleOpenChange = useCallback(\n    (nextOpen: boolean) => {\n      onOpenChange(nextOpen)\n      if (!nextOpen) {\n        form.reset(CHANNEL_FORM_DEFAULT_VALUES)\n        initializedFormTargetRef.current = null\n        resetCodexCredential()\n        resetDoubaoApiUnlock()\n      }\n    },\n    [onOpenChange, form, resetCodexCredential, resetDoubaoApiUnlock]\n  )\n\n"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new, 1))'

      - name: Migrate channel editor
        run: python3 .github/scripts/aurora-v21-channel-editor.py

      - name: Install frontend dependencies
        working-directory: web/default
        run: bun install --frozen-lockfile

      - name: Generate route tree and initial build
        working-directory: web/default
        run: bun run build

      - name: Format touched frontend files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACM -- web/default)
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do rel+=("${file#web/default/}"); done
            bun x prettier --write "${rel[@]}"
          fi

      - name: Typecheck
        working-directory: web/default
        run: bun run typecheck

      - name: Unit tests
        working-directory: web/default
        run: bun test

      - name: Lint touched TypeScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACM -- 'web/default/src/**/*.ts' 'web/default/src/**/*.tsx')
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do rel+=("${file#web/default/}"); done
            bun x eslint "${rel[@]}"
          fi

      - name: Check formatting on touched files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACM -- web/default)
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do rel+=("${file#web/default/}"); done
            bun x prettier --check "${rel[@]}"
          fi

      - name: Copyright check
        working-directory: web/default
        shell: bash
        run: |
          set +e
          output="$(bun run copyright:check 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if (( code == 0 )); then exit 0; fi
          mapfile -t reported < <(printf '%s\n' "$output" | sed -n 's/^- //p')
          unexpected=()
          for file in "${reported[@]}"; do
            if [[ "$file" != 'src/styles/aurora-accessibility.css' ]]; then unexpected+=("$file"); fi
          done
          if ((${#reported[@]} == 1 && ${#unexpected[@]} == 0)); then
            echo 'Allowing known pre-existing copyright debt only.'
            exit 0
          fi
          exit "$code"

      - name: Production build
        working-directory: web/default
        run: bun run build:check

      - name: Dead-code regression check
        working-directory: web/default
        shell: bash
        run: |
          set +e
          bun run knip > ../../knip-channel-editor.txt 2>&1
          code=$?
          cat ../../knip-channel-editor.txt
          if (( code == 0 )); then exit 0; fi
          unexpected=0
          while IFS= read -r file; do
            rel="${file#web/default/}"
            if grep -Fq "$rel" ../../knip-channel-editor.txt; then
              echo "knip reports a touched runtime file: $rel"
              unexpected=1
            fi
          done < <(git diff --name-only --diff-filter=ACM -- 'web/default/src/**')
          exit "$unexpected"

      - name: Verify channel editor invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f web/default/src/features/channels/components/editor/channel-editor-page.tsx
          test ! -f web/default/src/features/channels/components/drawers/channel-mutate-drawer.tsx
          test -f web/default/src/routes/_authenticated/channels/new.lazy.tsx
          test -f 'web/default/src/routes/_authenticated/channels/$channelId/edit.lazy.tsx'
          grep -q '/channels/new' web/default/src/routeTree.gen.ts
          grep -q '/channels/\$channelId/edit' web/default/src/routeTree.gen.ts
          ! grep -q 'ChannelMutateDrawer' web/default/src/features/channels/components/channels-dialogs.tsx
          ! grep -q "'create-channel'" web/default/src/features/channels/components/channels-provider.tsx
          ! grep -q "'update-channel'" web/default/src/features/channels/components/channels-provider.tsx
          ! grep -q '<Sheet' web/default/src/features/channels/components/editor/channel-editor.tsx
          grep -q 'createLazyFileRoute' web/default/src/routes/_authenticated/channels/new.lazy.tsx
          grep -q 'createLazyFileRoute' 'web/default/src/routes/_authenticated/channels/$channelId/edit.lazy.tsx'

      - name: Commit verified channel editor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/aurora-v21-channel-editor.yml
          rm -f .github/scripts/aurora-v21-channel-editor.py
          rm -f .github/workflows/aurora-v21-finish.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(channels): move channel editing to workspace routes'
          git push origin HEAD:main
