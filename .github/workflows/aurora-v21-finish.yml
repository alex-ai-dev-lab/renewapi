name: Aurora v2.1 Channel Editor Migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aurora-v21-finish.yml'
      - '.github/scripts/aurora-v21-channel-editor.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-v21-channel-editor-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Generate real Channel Editor workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/aurora-v21-channel-editor.py')
          text = path.read_text()
          old = 'r"\\n          <SheetFooter className=\\{sideDrawerFooterClassName\\(\\)\\}>[\\s\\S]*?</SheetFooter>\\n"'
          new = 'r"\\s*<SheetFooter\\b[\\s\\S]*?</SheetFooter>\\s*"'
          if old not in text:
              raise SystemExit('footer matcher patch target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/aurora-v21-channel-editor.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # Widen the inferred literal state to the complete section-id union.
          replace_once(
              'web/default/src/features/channels/components/editor/channel-editor.tsx',
              """  const [activeSection, setActiveSection] = useState(\n    CHANNEL_EDITOR_NAV_ITEMS[0].id\n  )""",
              """  const [activeSection, setActiveSection] = useState<\n    (typeof CHANNEL_EDITOR_NAV_ITEMS)[number]['id']\n  >(CHANNEL_EDITOR_NAV_ITEMS[0].id)""",
              'section nav state type',
          )

          # The inline channel-row shortcut is now an editor-page shortcut, not a Drawer shortcut.
          replace_once(
              'web/default/src/features/channels/components/channels-columns.tsx',
              "import { useQueryClient } from '@tanstack/react-query'\n",
              "import { useQueryClient } from '@tanstack/react-query'\nimport { useNavigate } from '@tanstack/react-router'\n",
              'columns navigate import',
          )
          replace_once(
              'web/default/src/features/channels/components/channels-columns.tsx',
              """function OpenPanelButton({ channel }: { channel: Channel }) {\n  const { t } = useTranslation()\n  const { setCurrentRow, setOpen } = useChannels()""",
              """function OpenPanelButton({ channel }: { channel: Channel }) {\n  const { t } = useTranslation()\n  const navigate = useNavigate()""",
              'columns editor shortcut hook',
          )
          replace_once(
              'web/default/src/features/channels/components/channels-columns.tsx',
              """                setCurrentRow(channel)\n                setOpen('update-channel')""",
              """                void navigate({\n                  to: '/channels/$channelId/edit',\n                  params: { channelId: String(channel.id) },\n                })""",
              'columns editor shortcut navigation',
          )

          # Copy remains a short Dialog, but the copied record opens in the full editor page.
          replace_once(
              'web/default/src/features/channels/components/dialogs/copy-channel-dialog.tsx',
              "import { useQueryClient } from '@tanstack/react-query'\n",
              "import { useQueryClient } from '@tanstack/react-query'\nimport { useNavigate } from '@tanstack/react-router'\n",
              'copy navigate import',
          )
          replace_once(
              'web/default/src/features/channels/components/dialogs/copy-channel-dialog.tsx',
              """  const { t } = useTranslation()\n  const { currentRow, setCurrentRow, setOpen } = useChannels()\n  const queryClient = useQueryClient()""",
              """  const { t } = useTranslation()\n  const { currentRow } = useChannels()\n  const queryClient = useQueryClient()\n  const navigate = useNavigate()""",
              'copy navigate hook',
          )
          replace_once(
              'web/default/src/features/channels/components/dialogs/copy-channel-dialog.tsx',
              """      setCurrentRow(copiedChannel.data)\n      setOpen('update-channel')""",
              """      void navigate({\n        to: '/channels/$channelId/edit',\n        params: { channelId: String(copiedChannel.data.id) },\n      })""",
              'copy editor navigation',
          )

          replace_once(
              'web/default/src/features/channels/components/channels-dialogs.tsx',
              '  const { open, setOpen, currentRow, upstream } = useChannels()\n',
              '  const { open, setOpen, upstream } = useChannels()\n',
              'remove unused dialogs currentRow',
          )
          PY

      - name: Install frontend dependencies
        working-directory: web/default
        run: bun install --frozen-lockfile

      - name: Format changed frontend files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACM -z -- web/default
            git ls-files --others --exclude-standard -z -- web/default
          )
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do rel+=("${file#web/default/}"); done
            bun x prettier --write "${rel[@]}"
          fi

      - name: Generate TanStack route tree
        working-directory: web/default
        run: bun run build

      - name: Typecheck
        working-directory: web/default
        run: bun run typecheck

      - name: Unit tests
        working-directory: web/default
        run: bun test

      - name: Lint changed TypeScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACM -z -- 'web/default/src/**/*.ts' 'web/default/src/**/*.tsx'
            git ls-files --others --exclude-standard -z -- 'web/default/src/**/*.ts' 'web/default/src/**/*.tsx'
          )
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do
              [[ "$file" == 'web/default/src/routeTree.gen.ts' ]] && continue
              rel+=("${file#web/default/}")
            done
            if ((${#rel[@]})); then bun x eslint --no-warn-ignored "${rel[@]}"; fi
          fi

      - name: Check formatting of changed frontend files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACM -z -- web/default
            git ls-files --others --exclude-standard -z -- web/default
          )
          if ((${#files[@]})); then
            cd web/default
            rel=()
            for file in "${files[@]}"; do
              [[ "$file" == 'web/default/src/routeTree.gen.ts' ]] && continue
              rel+=("${file#web/default/}")
            done
            if ((${#rel[@]})); then bun x prettier --check "${rel[@]}"; fi
          fi

      - name: Copyright check with known baseline exception
        working-directory: web/default
        shell: bash
        run: |
          set +e
          output="$(bun run copyright:check 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if (( code == 0 )); then exit 0; fi
          mapfile -t reported < <(printf '%s\n' "$output" | sed -n 's/^- //p')
          unexpected=()
          for file in "${reported[@]}"; do
            [[ "$file" == 'src/styles/aurora-accessibility.css' ]] || unexpected+=("$file")
          done
          if ((${#reported[@]} == 1 && ${#unexpected[@]} == 0)); then
            echo 'Allowing known pre-existing copyright header debt.'
            exit 0
          fi
          printf 'Unexpected copyright failures: %s\n' "${unexpected[*]:-unknown}"
          exit "$code"

      - name: Production build
        working-directory: web/default
        run: bun run build:check

      - name: Verify Channel Editor migration invariants
        shell: bash
        run: |
          set -euo pipefail
          editor='web/default/src/features/channels/components/editor/channel-editor.tsx'
          test -f "$editor"
          test -f web/default/src/features/channels/components/editor/channel-editor-page.tsx
          test -f web/default/src/features/channels/components/editor/channel-editor.test.tsx
          test -f web/default/src/routes/_authenticated/channels/new.lazy.tsx
          test -f 'web/default/src/routes/_authenticated/channels/$channelId/edit.lazy.tsx'
          test ! -f web/default/src/features/channels/components/drawers/channel-mutate-drawer.tsx
          test ! -f web/default/src/features/channels/components/drawers/channel-mutate-drawer.test.tsx
          ! grep -q "from '@/components/ui/sheet'" "$editor"
          ! grep -q 'SheetContent\|SheetFooter\|SheetHeader\|SheetClose' "$editor"
          ! grep -R -q "'update-channel'" web/default/src/features/channels/components
          ! grep -R -q "'create-channel'" web/default/src/features/channels/components
          grep -q 'currentRow' web/default/src/features/channels/components/channels-provider.tsx
          ! grep -q 'ChannelMutateDrawer' web/default/src/features/channels/components/channels-dialogs.tsx
          grep -Fq "to: '/channels/new'" web/default/src/features/channels/components/channels-primary-buttons.tsx
          grep -R -Fq "to: '/channels/\$channelId/edit'" web/default/src/features/channels/components
          grep -q 'useBlocker' "$editor"
          grep -q "data-ui='channel-editor-page'" "$editor"
          grep -q "id='channel-advanced'" "$editor"
          grep -q "createLazyFileRoute('/_authenticated/channels/new')" web/default/src/routes/_authenticated/channels/new.lazy.tsx
          grep -q "createLazyFileRoute('/_authenticated/channels/\$channelId/edit')" 'web/default/src/routes/_authenticated/channels/$channelId/edit.lazy.tsx'

      - name: Dead-code diagnostic for new Channel Editor runtime
        working-directory: web/default
        shell: bash
        run: |
          set +e
          bun run knip > /tmp/knip.txt 2>&1
          code=$?
          set -e
          cat /tmp/knip.txt
          if (( code != 0 )); then
            if grep -E '^src/features/channels/components/editor/(channel-editor|channel-editor-page)\.tsx[[:space:]]*$' /tmp/knip.txt; then
              echo 'A new Channel Editor runtime file is unused.'
              exit 1
            fi
            echo 'Only repository-wide baseline dead-code debt remains.'
          fi

      - name: Commit verified Channel Editor workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/aurora-v21-channel-editor.py
          rm -f .github/workflows/aurora-v21-finish.yml
          rm -f .github/workflows/aurora-v21-channel-editor.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(channels): move channel editing to workspace routes'
          git push origin HEAD:main
