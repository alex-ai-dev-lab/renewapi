name: Build renewapi source image package

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag. Defaults to the short source SHA."
        required: false
        type: string
      create_release:
        description: "Create a GitHub Release with the image tarball."
        required: false
        type: boolean
        default: true
      release_tag:
        description: "Optional release tag. Defaults to newapi-source-<image tag>."
        required: false
        type: string
      base_sha:
        description: "Optional base SHA used by changed-file quality checks."
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: newapi-source-image-package
  cancel-in-progress: false

env:
  UPSTREAM_REF: 4e570389dd433a717373ce9c9b822b59f5ed3d5d

jobs:
  database-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: renewapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renewapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d renewapi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify channel transaction on MySQL
        env:
          CHANNELCONFIG_TEST_DRIVER: mysql
          CHANNELCONFIG_TEST_DSN: root:root@tcp(127.0.0.1:3306)/renewapi_test?charset=utf8mb4&parseTime=True&loc=UTC
        run: go test -count=1 -run TestUpdateTransactionOnExternalDatabase ./service/channelconfig

      - name: Verify channel transaction on PostgreSQL
        env:
          CHANNELCONFIG_TEST_DRIVER: postgres
          CHANNELCONFIG_TEST_DSN: host=127.0.0.1 user=postgres password=postgres dbname=renewapi_test port=5432 sslmode=disable TimeZone=UTC
        run: go test -count=1 -run TestUpdateTransactionOnExternalDatabase ./service/channelconfig

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Go source and backend
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          mapfile -t changed_go < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.go')
          if ((${#changed_go[@]})); then
            unformatted="$(gofmt -l "${changed_go[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf 'Go files require gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi
          go test -count=1 ./...
          go vet ./...
          go build ./...

      - name: Install default frontend dependencies
        working-directory: web/default
        run: bun install --frozen-lockfile

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun test
          bun run typecheck
          bun run build

      - name: Verify changed default frontend files
        shell: bash
        working-directory: web/default
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          mapfile -t changed < <(
            git -C ../.. diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- web/default/src web/default/scripts |
              sed 's#^web/default/##'
          )
          mapfile -t lint_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)
          mapfile -t format_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|css|scss|json)$' || true)
          if ((${#lint_files[@]})); then
            bunx eslint "${lint_files[@]}"
            bun run copyright:check -- "${lint_files[@]}"
          fi
          if ((${#format_files[@]})); then
            bunx prettier --check "${format_files[@]}"
          fi

      - name: Install classic frontend dependencies
        working-directory: web/classic
        run: bun install --frozen-lockfile

      - name: Build classic frontend
        working-directory: web/classic
        run: bun run build

      - name: Verify commit diff
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: git diff --check "${INPUT_BASE_SHA:-$GITHUB_SHA^}" "$GITHUB_SHA"

  build:
    needs: [quality, database-quality]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      tarball: ${{ steps.meta.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::12}"
          raw_tag="${INPUT_IMAGE_TAG:-sha-$short}"
          tag="$(printf '%s' "$raw_tag" | tr -c 'A-Za-z0-9_.-' '-')"
          tag="${tag%-}"
          if [ -z "$tag" ]; then
            tag="sha-$short"
          fi
          release_tag="${INPUT_RELEASE_TAG:-renewapi-source-$tag}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/renewapi"
          tarball="renewapi-${tag}-linux-amd64.tar.gz"
          {
            echo "short=$short"
            echo "tag=$tag"
            echo "release_tag=$release_tag"
            echo "image=$image"
            echo "tarball=$tarball"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            UPSTREAM_REF=${{ env.UPSTREAM_REF }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Export linux/amd64 image tarball
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
          CREATED: ${{ steps.meta.outputs.created }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg "VERSION=$TAG" \
            --build-arg "COMMIT_SHA=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$CREATED" \
            --build-arg "UPSTREAM_REF=$UPSTREAM_REF" \
            -t "$IMAGE:$TAG-amd64-package" \
            .
          docker save "$IMAGE:$TAG-amd64-package" | gzip -9 > "release-assets/$TARBALL"
          cp docker-compose.yml .env.example release-assets/
          (
            cd release-assets
            sha256sum "$TARBALL" docker-compose.yml .env.example > CHECKSUMS.txt
          )

      - name: Prepare release notes
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > release-assets/RELEASE_NOTES.md <<EOF
          Image: ${IMAGE}:${TAG}
          Digest: ${DIGEST}
          Source commit: ${GITHUB_SHA}
          Audited upstream ref: ${UPSTREAM_REF}

          This package is built directly from the source fork.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tarball }}
          path: release-assets/
          retention-days: 7

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: renewapi source image ${{ steps.meta.outputs.tag }}
          body_path: release-assets/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/${{ steps.meta.outputs.tarball }}
            release-assets/docker-compose.yml
            release-assets/.env.example
            release-assets/CHECKSUMS.txt
