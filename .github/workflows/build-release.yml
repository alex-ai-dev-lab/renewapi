name: Build renewapi source image package

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag. Defaults to the short source SHA."
        required: false
        type: string
      create_release:
        description: "Create a GitHub Release with the image tarball."
        required: false
        type: boolean
        default: true
      release_tag:
        description: "Optional release tag. Defaults to newapi-source-<image tag>."
        required: false
        type: string
      base_sha:
        description: "Optional base SHA used by changed-file quality checks."
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: newapi-source-image-package
  cancel-in-progress: false

env:
  UPSTREAM_REF: 58d4e9bd3bb035df8ea235dd682ccc8a45d0332a

jobs:
  database-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: renewapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renewapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d renewapi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify channel transaction on MySQL
        env:
          CHANNELCONFIG_TEST_DRIVER: mysql
          CHANNELCONFIG_TEST_DSN: root:root@tcp(127.0.0.1:3306)/renewapi_test?charset=utf8mb4&parseTime=True&loc=UTC
        run: go test -count=1 -run TestUpdateTransactionOnExternalDatabase ./service/channelconfig

      - name: Verify RequestGuard migration on MySQL
        env:
          REQUEST_GUARD_TEST_DRIVER: mysql
          REQUEST_GUARD_TEST_DSN: root:root@tcp(127.0.0.1:3306)/renewapi_test?charset=utf8mb4&parseTime=True&loc=UTC
        run: go test -count=1 -run TestMigrateRequestGuardEventsExternalDatabase ./model

      - name: Verify channel transaction on PostgreSQL
        env:
          CHANNELCONFIG_TEST_DRIVER: postgres
          CHANNELCONFIG_TEST_DSN: host=127.0.0.1 user=postgres password=postgres dbname=renewapi_test port=5432 sslmode=disable TimeZone=UTC
        run: go test -count=1 -run TestUpdateTransactionOnExternalDatabase ./service/channelconfig

      - name: Verify RequestGuard migration on PostgreSQL
        env:
          REQUEST_GUARD_TEST_DRIVER: postgres
          REQUEST_GUARD_TEST_DSN: host=127.0.0.1 user=postgres password=postgres dbname=renewapi_test port=5432 sslmode=disable TimeZone=UTC
        run: go test -count=1 -run TestMigrateRequestGuardEventsExternalDatabase ./model

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changed-file checks below compare against the base commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Go formatting
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          mapfile -t changed_go < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.go')
          if ((${#changed_go[@]})); then
            unformatted="$(gofmt -l "${changed_go[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf 'Go files require gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Verify changed JSON boundary
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          added="$(git diff --unified=0 "$base" "$GITHUB_SHA" -- '*.go' | grep '^+' | grep -v '^+++' || true)"
          violations="$(printf '%s\n' "$added" | grep -E '("encoding/json"|json\.(Marshal|Unmarshal|NewEncoder|NewDecoder)\()' || true)"
          if [[ -n "$violations" ]]; then
            printf '%s\n' 'New direct encoding/json usage is forbidden; use common.Marshal/common.Unmarshal and the shared JSON boundary:'
            printf '%s\n' "$violations"
            exit 1
          fi

      - name: Verify Go module integrity
        run: |
          go mod verify
          go mod tidy -diff

      - name: Capture tracked Go package directories
        shell: bash
        run: |
          set -euo pipefail
          package_file="$RUNNER_TEMP/renewapi-go-package-dirs"
          while IFS= read -r -d '' file; do
            dirname "$file"
          done < <(git ls-files -z -- '*.go') \
            | sort -u \
            | awk '$0 == "." { print "."; next } { print "./" $0 }' \
            > "$package_file"
          test -s "$package_file"
          if grep -q '/node_modules/' "$package_file"; then
            printf '%s\n' 'Tracked Go package list unexpectedly includes node_modules:'
            grep '/node_modules/' "$package_file"
            exit 1
          fi
          printf 'Captured %s tracked Go package directories.\n' "$(wc -l < "$package_file")"

      - name: Install default frontend dependencies
        working-directory: web/default
        run: bun install --frozen-lockfile

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun test
          bun run typecheck
          bun run build

      - name: Verify changed default frontend files
        shell: bash
        working-directory: web/default
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          mapfile -t changed < <(
            git -C ../.. diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- web/default/src web/default/scripts |
              sed 's#^web/default/##'
          )
          mapfile -t lint_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)
          mapfile -t format_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|css|scss|json)$' || true)
          if ((${#lint_files[@]})); then
            bunx eslint "${lint_files[@]}"
            bun run copyright:check -- "${lint_files[@]}"
          fi
          if ((${#format_files[@]})); then
            bunx prettier --check "${format_files[@]}"
          fi

      - name: Install classic frontend dependencies
        working-directory: web/classic
        run: bun install --frozen-lockfile

      - name: Build classic frontend
        working-directory: web/classic
        run: bun run build

      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail
          package_file="$RUNNER_TEMP/renewapi-go-package-dirs"
          test -s "$package_file"
          mapfile -t go_packages < "$package_file"
          printf 'Verifying %s tracked Go package directories.\n' "${#go_packages[@]}"
          go test -count=1 "${go_packages[@]}"
          go test -race -count=1 -run 'TestObservedCapability|TestManualUnknownFallsBack|TestChannelMatchesResponsesRequirement|TestPlanResponsesExecution|TestResponsesCompactionProbeModels' ./service ./controller
          go test -race -count=1 ./relay/channel ./relay/channel/baidu ./relay/channel/openai ./relay/channel/claude ./relay/channel/gemini ./relay/channel/codex
          go vet "${go_packages[@]}"
          go build "${go_packages[@]}"

      - name: Verify commit diff
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: git diff --check "${INPUT_BASE_SHA:-$GITHUB_SHA^}" "$GITHUB_SHA"
  build:
    needs: [quality, database-quality]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      tarball: ${{ steps.meta.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release build only needs the checked-out source tree.
          fetch-depth: 1

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::12}"
          raw_tag="${INPUT_IMAGE_TAG:-sha-$short}"
          tag="$(printf '%s' "$raw_tag" | tr -c 'A-Za-z0-9_.-' '-')"
          tag="${tag%-}"
          if [ -z "$tag" ]; then
            tag="sha-$short"
          fi
          release_tag="${INPUT_RELEASE_TAG:-renewapi-source-$tag}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/renewapi"
          tarball="renewapi-${tag}-linux-amd64.tar.gz"
          {
            echo "short=$short"
            echo "tag=$tag"
            echo "release_tag=$release_tag"
            echo "image=$image"
            echo "tarball=$tarball"
            ref="${GITHUB_REF_NAME:-detached}"
            cache_ref="$(printf '%s' "$ref" | tr -c 'A-Za-z0-9_.-' '-')"
            cache_ref="${cache_ref%-}"
            if [ -z "$cache_ref" ]; then
              cache_ref="detached"
            fi
            echo "cache_scope=renewapi-${GITHUB_EVENT_NAME}-${cache_ref}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            UPSTREAM_REF=${{ env.UPSTREAM_REF }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.cache_scope }}
          # Frontend builders are intermediate stages; mode=max is required to
          # restore Bun/Vite/Rsbuild layers on the next run. Move to mode=min
          # only after the prebuilt-dist artifact flow removes those stages.
          cache-to: type=gha,scope=${{ steps.meta.outputs.cache_scope }},mode=max
          provenance: true
          sbom: true

      - name: Export linux/amd64 image tarball
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Reuse the exact amd64 image just pushed by the multi-arch build;
          # do not parse or execute the Dockerfile a second time.
          docker pull --platform linux/amd64 "$IMAGE:$TAG"
          test "$(docker image inspect "$IMAGE:$TAG" --format '{{.Architecture}}')" = amd64
          docker save "$IMAGE:$TAG" | gzip -9 > "release-assets/$TARBALL"
          cp compose.yaml docker-compose.yml release-assets/
          cp .env.example release-assets/default.env.example
          (
            cd release-assets
            sha256sum "$TARBALL" compose.yaml docker-compose.yml default.env.example > CHECKSUMS.txt
          )

      - name: Prepare release notes
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > release-assets/RELEASE_NOTES.md <<EOF
          Image: ${IMAGE}:${TAG}
          Digest: ${DIGEST}
          Source commit: ${GITHUB_SHA}
          Audited upstream ref: ${UPSTREAM_REF}

          This package is built directly from the source fork.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tarball }}
          path: release-assets/
          retention-days: 7

      - name: Download uploaded release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tarball }}
          path: uploaded-release-assets

      - name: Verify uploaded release artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f uploaded-release-assets/${{ steps.meta.outputs.tarball }}
          test -f uploaded-release-assets/compose.yaml
          test -f uploaded-release-assets/docker-compose.yml
          test -f uploaded-release-assets/default.env.example
          test -f uploaded-release-assets/CHECKSUMS.txt
          (
            cd uploaded-release-assets
            sha256sum -c CHECKSUMS.txt
          )

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: renewapi source image ${{ steps.meta.outputs.tag }}
          body_path: release-assets/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/${{ steps.meta.outputs.tarball }}
            release-assets/compose.yaml
            release-assets/docker-compose.yml
            release-assets/default.env.example
            release-assets/CHECKSUMS.txt

      - name: Verify release tag source commit
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$actual" = "$GITHUB_SHA"
