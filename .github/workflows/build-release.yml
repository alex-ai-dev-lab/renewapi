name: 检查并发布 RenewAPI Releases

on:
  push:
    branches: [main]
    tags: ['renewapi-v*']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 本次发布授权的完整源码 SHA
        required: false
        type: string
      image_tag:
        description: 可选源码镜像标签，默认使用源码 SHA
        required: false
        type: string
      release_tag:
        description: 可选源码包标签，必须使用 renewapi-source- 或 renewapi-build- 前缀
        required: false
        type: string
      base_sha:
        description: 可选改动检查基线 SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: renewapi-release-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REF: 58d4e9bd3bb035df8ea235dd682ccc8a45d0332a

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      product_version: ${{ steps.meta.outputs.product_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      build_channel: ${{ steps.meta.outputs.build_channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
      created: ${{ steps.meta.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成可追溯发布身份
        id: meta
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release-metadata.mjs

  database-quality:
    uses: ./.github/workflows/reliability-validation.yml

  secondary-surfaces:
    uses: ./.github/workflows/aurora-secondary-surfaces.yml

  settings-wave2:
    uses: ./.github/workflows/settings-advanced-phase-e-wave2.yml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changed-file checks below compare against the base commit.
          fetch-depth: 0

      - name: 验证发布身份边界
        run: node --test scripts/release-metadata.test.mjs

      - name: Verify immutable release source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Verify product tag and VERSION
        if: startsWith(github.ref, 'refs/tags/renewapi-v')
        run: bash scripts/validate-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 验证工作流定义
        env:
          GOTOOLCHAIN: go1.25.1
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Verify Compose templates
        env:
          SESSION_SECRET: compose-config-validation-only
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f docker-compose.yml config --quiet

      - name: Verify Go formatting
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          if [[ "$base" =~ ^0+$ ]]; then base="$GITHUB_SHA^"; fi
          mapfile -t changed_go < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.go')
          if ((${#changed_go[@]})); then
            unformatted="$(gofmt -l "${changed_go[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf 'Go files require gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Verify changed JSON boundary
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          if [[ "$base" =~ ^0+$ ]]; then base="$GITHUB_SHA^"; fi
          added="$(git diff --unified=0 "$base" "$GITHUB_SHA" -- '*.go' ':(exclude)common/json.go' | grep '^+' | grep -v '^+++' || true)"
          violations="$(printf '%s\n' "$added" | grep -E '("encoding/json"|json\.(Marshal|Unmarshal|NewEncoder|NewDecoder)\()' || true)"
          if [[ -n "$violations" ]]; then
            printf '%s\n' 'New direct encoding/json usage is forbidden; use common.Marshal/common.Unmarshal and the shared JSON boundary:'
            printf '%s\n' "$violations"
            exit 1
          fi

      - name: Verify Go module integrity
        run: |
          go mod verify
          go mod tidy -diff

      - name: Capture tracked Go package directories
        shell: bash
        run: |
          set -euo pipefail
          package_file="$RUNNER_TEMP/renewapi-go-package-dirs"
          while IFS= read -r -d '' file; do
            dirname "$file"
          done < <(git ls-files -z -- '*.go') \
            | sort -u \
            | awk '$0 == "." { print "."; next } { print "./" $0 }' \
            > "$package_file"
          test -s "$package_file"
          if grep -q '/node_modules/' "$package_file"; then
            printf '%s\n' 'Tracked Go package list unexpectedly includes node_modules:'
            grep '/node_modules/' "$package_file"
            exit 1
          fi
          printf 'Captured %s tracked Go package directories.\n' "$(wc -l < "$package_file")"

      - name: Install default frontend dependencies
        working-directory: web/default
        run: bun install --frozen-lockfile

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun test
          bun run typecheck
          bun run build

      - name: Verify changed default frontend files
        shell: bash
        working-directory: web/default
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          if [[ "$base" =~ ^0+$ ]]; then base="$GITHUB_SHA^"; fi
          mapfile -t changed < <(
            git -C ../.. diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- web/default/src web/default/scripts |
              sed 's#^web/default/##'
          )
          mapfile -t lint_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)
          mapfile -t format_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|css|scss|json)$' || true)
          if ((${#lint_files[@]})); then
            bunx eslint --no-ignore "${lint_files[@]}"
            bun run copyright:check -- "${lint_files[@]}"
          fi
          if ((${#format_files[@]})); then
            bunx prettier --check "${format_files[@]}"
          fi

      - name: Install classic frontend dependencies
        working-directory: web/classic
        run: bun install --frozen-lockfile

      - name: Build classic frontend
        working-directory: web/classic
        run: bun run build

      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail
          package_file="$RUNNER_TEMP/renewapi-go-package-dirs"
          test -s "$package_file"
          mapfile -t go_packages < "$package_file"
          printf 'Verifying %s tracked Go package directories.\n' "${#go_packages[@]}"
          go test -count=1 "${go_packages[@]}"
          go test -race -count=1 -run 'TestObservedCapability|TestManualUnknownFallsBack|TestChannelMatchesResponsesRequirement|TestPlanResponsesExecution|TestResponsesCompactionProbeModels' ./service ./controller
          go test -race -count=1 ./relay/channel ./relay/channel/baidu ./relay/channel/openai ./relay/channel/claude ./relay/channel/gemini ./relay/channel/codex
          go vet "${go_packages[@]}"
          go build "${go_packages[@]}"

      - name: Verify commit diff
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha || github.event.before }}
        run: |
          base="${INPUT_BASE_SHA:-$GITHUB_SHA^}"
          if [[ "$base" =~ ^0+$ ]]; then base="$GITHUB_SHA^"; fi
          git diff --check "$base" "$GITHUB_SHA"

  build:
    needs: [release-info, quality, database-quality, secondary-surfaces, settings-wave2]
    name: 离线镜像 ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      IMAGE: ${{ needs.release-info.outputs.image }}
      IMAGE_TAG: ${{ needs.release-info.outputs.tag }}
      BUILD_CHANNEL: ${{ needs.release-info.outputs.build_channel }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建并加载本地镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ needs.release-info.outputs.image }}
          build-args: |
            VERSION=${{ needs.release-info.outputs.product_version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.release-info.outputs.created }}
            BUILD_CHANNEL=${{ needs.release-info.outputs.build_channel }}
            UPSTREAM_REF=${{ env.UPSTREAM_REF }}
          cache-from: type=gha,scope=renewapi-release-${{ matrix.arch }}
          cache-to: type=gha,scope=renewapi-release-${{ matrix.arch }},mode=max
          # Docker 离线归档不支持内嵌 OCI 证明，另附镜像元数据和完整校验和。
          provenance: false
          sbom: false
      - name: 验证镜像身份、架构与迁移
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          docker image inspect "$IMAGE" > "release-assets/image-linux-$ARCH.json"
          jq -e --arg arch "$ARCH" --arg sha "$GITHUB_SHA" '.[0].Architecture == $arch and .[0].Config.Labels["org.opencontainers.image.revision"] == $sha' "release-assets/image-linux-$ARCH.json"
          docker run --rm --entrypoint /bin/sh \
            -e SESSION_SECRET=release-image-validation-only \
            -e SQLITE_PATH=/tmp/release-validation.db -e NODE_TYPE=slave \
            -e UPDATE_TASK=false -e OFFICIAL_PRICE_SYNC_ENABLED=false \
            "$IMAGE" -ec '/app/new-api migrate --up && /app/new-api migrate --check'
          images=("$IMAGE")
          if [[ "$BUILD_CHANNEL" == 'edge' ]]; then
            docker tag "$IMAGE" renewapi:edge
            images+=(renewapi:edge)
          fi
          docker save "${images[@]}" | gzip -n -9 > "release-assets/renewapi-$IMAGE_TAG-linux-$ARCH.tar.gz"
      - name: 暂存已验证镜像供统一发布
        uses: actions/upload-artifact@v4
        with:
          name: image-linux-${{ matrix.arch }}
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [release-info, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.release-info.outputs.image }}
      PRODUCT_VERSION: ${{ needs.release-info.outputs.product_version }}
      RELEASE_TAG: ${{ needs.release-info.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.release-info.outputs.release_name }}
      PRERELEASE: ${{ needs.release-info.outputs.prerelease }}
      MAKE_LATEST: ${{ needs.release-info.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v4
      - name: 汇总两个架构的镜像
        uses: actions/download-artifact@v4
        with:
          pattern: image-linux-*
          path: release-assets
          merge-multiple: true
      - name: 下载页面检查证据
        uses: actions/download-artifact@v4
        with:
          name: aurora-secondary-surfaces
          path: qa-evidence/secondary-surfaces
      - name: 下载设置检查证据
        uses: actions/download-artifact@v4
        with:
          name: settings-advanced-phase-e-wave2
          path: qa-evidence/settings-wave2
      - name: 下载四版本数据库验证证据
        uses: actions/download-artifact@v4
        with:
          pattern: database-*
          path: qa-evidence/databases
      - name: 打包配置、验证证据与校验和
        shell: bash
        run: |
          set -euo pipefail
          cp compose.yaml docker-compose.yml release-assets/
          cp .env.example release-assets/default.env.example
          sed -i "s|^# NEWAPI_IMAGE=.*|NEWAPI_IMAGE=$IMAGE|" release-assets/default.env.example
          tar -czf release-assets/qa-secondary-surfaces.tar.gz -C qa-evidence/secondary-surfaces .
          tar -czf release-assets/qa-settings-wave2.tar.gz -C qa-evidence/settings-wave2 .
          tar -czf release-assets/qa-databases.tar.gz -C qa-evidence/databases .
          jq -n --arg sha "$GITHUB_SHA" --arg image "$IMAGE" --arg version "$PRODUCT_VERSION" --arg run "$GITHUB_RUN_ID" \
            '{source_commit: $sha, image: $image, product_version: $version, actions_run: $run, distribution: "github-releases", architectures: ["amd64", "arm64"]}' > release-assets/build-info.json
          cat > release-assets/RELEASE_NOTES.md <<EOF
          本次构建已通过后端、双前端、四版本数据库和实际浏览器检查。

          产品版本：$PRODUCT_VERSION
          源码提交：$GITHUB_SHA
          本地镜像：$IMAGE
          检查记录：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          按主机架构下载 linux-amd64 或 linux-arm64 镜像归档。下载 CHECKSUMS.txt 后运行 sha256sum --ignore-missing -c CHECKSUMS.txt，再用 docker load -i 对应归档 导入镜像。
          首次配置可复制 default.env.example 为 .env 并设置 SESSION_SECRET，再使用随附 Compose 文件。已有安装应保留原数据库和配置，单独更新 NEWAPI_IMAGE。
          镜像仅通过 Releases 分发，不需要登录或拉取 GHCR。两个 QA 包和数据库证据包保存本次检查结果。
          EOF
          checksums="$RUNNER_TEMP/renewapi-release-checksums.txt"
          (cd release-assets && find . -maxdepth 1 -type f ! -name CHECKSUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$checksums"
          cp "$checksums" release-assets/CHECKSUMS.txt
      - name: 上传草稿、下载校验后正式发布
        run: bash scripts/publish-release.sh
