name: Channel Editor Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/channel-editor-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build focused runtime
        run: |
          set -euo pipefail
          cd web/default
          bun install --frozen-lockfile
          bun run build
          bun add --no-save playwright@1.55.0
          cd ../classic
          bun install --frozen-lockfile
          bun run build
          cd ../..
          go build -o "$RUNNER_TEMP/renewapi-channel-diag" .
          SQLITE_PATH="$RUNNER_TEMP/renewapi-channel-diag.db" \
          SESSION_SECRET='channel-editor-diag-migrate' \
          GIN_MODE=release DEBUG=false MEMORY_CACHE_ENABLED=false \
          OFFICIAL_PRICE_SYNC_ENABLED=false UPDATE_TASK=false \
          BATCH_UPDATE_ENABLED=false NODE_TYPE=slave TZ=Asia/Taipei \
          "$RUNNER_TEMP/renewapi-channel-diag" migrate --up
      - name: Diagnose /channels/new in real Chrome
        working-directory: web/default
        env:
          QA_BINARY: ${{ runner.temp }}/renewapi-channel-diag
          QA_DB: ${{ runner.temp }}/renewapi-channel-diag.db
        run: |
          set -euo pipefail
          cat > .channel-editor-diag.mjs <<'EOF'
          import { spawn } from 'node:child_process'
          import { chromium } from 'playwright'

          const port = 4173
          const baseURL = `http://127.0.0.1:${port}`
          const binary = process.env.QA_BINARY
          const db = process.env.QA_DB
          const username = 'qaadmin'
          const password = 'QaRoot123!'
          const child = spawn(binary, [], {
            env: {
              ...process.env,
              PORT: String(port), SQLITE_PATH: db,
              SESSION_SECRET: 'channel-editor-diag-runtime', COOKIE_SECURE: 'false',
              GIN_MODE: 'release', DEBUG: 'false', MEMORY_CACHE_ENABLED: 'false',
              OFFICIAL_PRICE_SYNC_ENABLED: 'false', UPDATE_TASK: 'false',
              BATCH_UPDATE_ENABLED: 'false', NODE_TYPE: 'slave', TZ: 'Asia/Taipei',
            },
            stdio: ['ignore', 'pipe', 'pipe'],
          })
          child.stdout.on('data', (chunk) => process.stdout.write(`[backend] ${chunk}`))
          child.stderr.on('data', (chunk) => process.stderr.write(`[backend] ${chunk}`))

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
          async function waitReady() {
            for (let i = 0; i < 120; i += 1) {
              try {
                const response = await fetch(`${baseURL}/api/setup`)
                if (response.ok) return
              } catch {}
              await sleep(250)
            }
            throw new Error('backend readiness timeout')
          }

          let browser
          try {
            await waitReady()
            browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox'],
            })
            const context = await browser.newContext({
              baseURL,
              viewport: { width: 1440, height: 1000 },
            })
            let setup = await context.request.get(`${baseURL}/api/setup`)
            let setupBody = await setup.json()
            if (!setupBody.data?.status) {
              setup = await context.request.post(`${baseURL}/api/setup`, {
                data: {
                  username,
                  password,
                  confirmPassword: password,
                  SelfUseModeEnabled: false,
                  DemoSiteEnabled: false,
                },
              })
              console.log('[diag] setup:', setup.status(), await setup.text())
            }
            const login = await context.request.post(`${baseURL}/api/user/login`, {
              data: { username, password },
            })
            const loginBody = await login.json()
            console.log(
              '[diag] login status:',
              login.status(),
              'success=',
              loginBody?.success,
              'role=',
              loginBody?.data?.role
            )
            await context.addInitScript((user) => {
              localStorage.setItem('i18nextLng', 'en-US')
              localStorage.setItem('theme', 'light')
              localStorage.setItem('user', JSON.stringify(user))
              localStorage.setItem('uid', String(user.id))
            }, loginBody.data)

            const page = await context.newPage()
            const consoleErrors = []
            const pageErrors = []
            const badResponses = []
            page.on('console', (message) => {
              if (message.type() === 'error') {
                consoleErrors.push(message.text())
                console.log('[console.error]', message.text())
              }
            })
            page.on('pageerror', (error) => {
              pageErrors.push({ message: error.message, stack: error.stack })
              console.log('[pageerror]', error.stack || error.message)
            })
            page.on('response', (response) => {
              if (response.status() >= 400) {
                badResponses.push({ status: response.status(), url: response.url() })
                console.log('[bad-response]', response.status(), response.url())
              }
            })

            const navigation = await page.goto(`${baseURL}/channels/new`, {
              waitUntil: 'domcontentloaded',
            })
            await sleep(6000)
            console.log('[diag] navigation status:', navigation?.status())
            console.log('[diag] final URL:', page.url())
            console.log('[diag] route sentinels:', await page.locator('[data-qa-route-id]').count())
            console.log('[diag] editor sentinels:', await page.locator('[data-ui="channel-editor-page"]').count())
            console.log('[diag] not-found sentinels:', await page.locator('[data-page-state="not-found"]').count())
            console.log('[diag] consoleErrors:', JSON.stringify(consoleErrors, null, 2))
            console.log('[diag] pageErrors:', JSON.stringify(pageErrors, null, 2))
            console.log('[diag] badResponses:', JSON.stringify(badResponses, null, 2))
            const body = await page.locator('body').innerText().catch(() => '')
            console.log('[diag] body text:\n' + body.slice(0, 8000))
            const html = await page.content().catch(() => '')
            console.log('[diag] html prefix:\n' + html.slice(0, 12000))
            await context.close()
          } finally {
            if (browser) await browser.close().catch(() => {})
            if (child.exitCode === null) child.kill('SIGTERM')
          }
          EOF
          trap 'rm -f .channel-editor-diag.mjs' EXIT
          bun .channel-editor-diag.mjs
      - name: Remove diagnostic workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f web/default/.channel-editor-diag.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/channel-editor-diagnostic.yml
          git commit -m 'chore(qa): remove channel editor diagnostic workflow'
          git push origin HEAD:main
