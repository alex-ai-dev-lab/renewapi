name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify changed Go formatting
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA^"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.go')
          if ((${#changed[@]})); then
            unformatted="$(gofmt -l "${changed[@]}")"
            if [[ -n "$unformatted" ]]; then
              printf 'Go files require gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Test, vet, and build
        run: |
          go test -count=1 ./...
          go vet ./...
          go build ./...

  frontend-default:
    name: Default frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test, typecheck, and build
        run: |
          bun test
          bun run typecheck
          bun run build
      - name: Verify changed frontend files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA^"
          fi
          mapfile -t changed < <(
            git -C ../.. diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- web/default/src web/default/scripts |
              sed 's#^web/default/##'
          )
          mapfile -t lint_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)
          mapfile -t format_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|css|scss|json)$' || true)
          if ((${#lint_files[@]})); then
            bunx eslint "${lint_files[@]}"
            bun run copyright:check -- "${lint_files[@]}"
          fi
          if ((${#format_files[@]})); then
            bunx prettier --check "${format_files[@]}"
          fi

  frontend-classic:
    name: Classic frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/classic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Verify changed classic files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA^"
          fi
          mapfile -t changed < <(
            git -C ../.. diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- web/classic/src |
              sed 's#^web/classic/##'
          )
          mapfile -t lint_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(js|jsx)$' || true)
          mapfile -t format_files < <(printf '%s\n' "${changed[@]}" | grep -E '\.(js|jsx|css|scss|json)$' || true)
          if ((${#lint_files[@]})); then
            bunx eslint --no-cache "${lint_files[@]}"
          fi
          if ((${#format_files[@]})); then
            bunx prettier --check "${format_files[@]}"
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend-default
      - frontend-classic
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: renewapi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
