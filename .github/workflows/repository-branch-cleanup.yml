name: Repository branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete non-main branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              '__DO_NOT_CREATE__',
              'fix/aurora-request-guard-confirmation',
              'design/aurora-phase-c-deep-states',
              'THIS_SHOULD_NOT_BE_CREATED',
              '__branch_cleanup_runner__',
              'cleanup-now',
              'delete-me',
              'oops-cleanup',
              'temp-cleanup-1',
            ]
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                })
                core.info(`Deleted ${branch}`)
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Skipping ${branch}: ${error.message}`)
                  continue
                }
                throw error
              }
            }
