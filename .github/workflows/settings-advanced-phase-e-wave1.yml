name: Settings Advanced Phase E Wave 1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: settings-advanced-phase-e-wave1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-backend-wave1:
    if: github.head_ref == 'qa/aurora-advanced-settings-phase-e'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Build classic frontend
        working-directory: web/classic
        run: |
          if ! bun install --frozen-lockfile; then
            bun pm cache rm
            bun install --frozen-lockfile
          fi
          bun run build

      - name: Build real RenewAPI binary
        run: go build -o "$RUNNER_TEMP/renewapi-settings-phase-e" .

      - name: Bootstrap fresh SQLite with production migrations
        env:
          SQLITE_PATH: ${{ runner.temp }}/renewapi-settings-phase-e.db
          SESSION_SECRET: settings-advanced-phase-e-wave1-2026-08-23
          GIN_MODE: release
          DEBUG: 'false'
          MEMORY_CACHE_ENABLED: 'false'
          OFFICIAL_PRICE_SYNC_ENABLED: 'false'
          UPDATE_TASK: 'false'
          BATCH_UPDATE_ENABLED: 'false'
          NODE_TYPE: slave
          TZ: Asia/Taipei
        run: |
          "$RUNNER_TEMP/renewapi-settings-phase-e" migrate --up
          "$RUNNER_TEMP/renewapi-settings-phase-e" migrate --check

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Rehydrate hardened real-backend harness
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/alex-ai-dev-lab/renewapi/6bcd52eef0101993221c8648cafef2b442494e0f/.github/settings-real-backend-hardened.mjs \
            -o /tmp/settings-real-backend-hardened.mjs
          python3 .github/patch-settings-advanced-phase-e.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/settings-real-backend-hardened.mjs')
          text = path.read_text()
          old = "  ModelRequestRateLimitGroup: '',"
          new = "  ModelRequestRateLimitGroup: '{}',"
          if text.count(old) != 1:
              raise SystemExit(f'expected one explicit advanced baseline group marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cp /tmp/settings-real-backend-hardened.mjs web/default/.settings-advanced-phase-e-wave1.mjs

      - name: Run Advanced Settings real-backend Wave 1
        working-directory: web/default
        env:
          QA_BINARY: ${{ runner.temp }}/renewapi-settings-phase-e
          QA_DB: ${{ runner.temp }}/renewapi-settings-phase-e.db
          QA_OUT: ../../qa-artifacts/settings-advanced-phase-e-wave1
          QA_PORT: '4173'
        run: bun .settings-advanced-phase-e-wave1.mjs

      - name: Show Wave 1 summary
        if: always()
        run: |
          cat qa-artifacts/settings-advanced-phase-e-wave1/summary.txt || true
          cat qa-artifacts/settings-advanced-phase-e-wave1/failure.json || true

      - name: Upload Wave 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-advanced-phase-e-wave1
          path: qa-artifacts/settings-advanced-phase-e-wave1
          if-no-files-found: error
