name: Settings Advanced Phase E Wave 2

on:
  push:
    branches:
      - main
    paths:
      - '.github/settings-advanced-phase-e-wave2.mjs'
      - '.github/workflows/settings-advanced-phase-e-wave2.yml'
      - 'controller/option.go'
      - 'controller/request_guard.go'
      - 'controller/request_guard_test.go'
      - 'controller/option_validation_test.go'
      - 'model/log.go'
      - 'model/log_index_test.go'
      - 'model/option.go'
      - 'model/option_rollback_test.go'
      - 'web/default/src/features/system-settings/maintenance/log-settings-section.tsx'
      - 'web/default/src/features/system-settings/models/**'
      - 'web/default/src/features/system-settings/security/anti-poison-guard-section.tsx'
      - 'web/default/src/features/system-settings/security/request-guard-*.ts*'
      - 'web/default/src/features/system-settings/security/request-guard-section.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-advanced-phase-e-wave2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-backend-wave2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Build classic frontend
        working-directory: web/classic
        run: |
          if ! bun install --frozen-lockfile; then
            bun pm cache rm
            bun install --frozen-lockfile
          fi
          bun run build

      - name: Build real RenewAPI binary
        run: go build -o "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" .

      - name: Bootstrap fresh SQLite with production migrations
        env:
          SQLITE_PATH: ${{ runner.temp }}/renewapi-settings-phase-e-wave2.db
          SESSION_SECRET: settings-advanced-phase-e-wave2-2026-08-24
          GIN_MODE: release
          DEBUG: 'false'
          MEMORY_CACHE_ENABLED: 'false'
          OFFICIAL_PRICE_SYNC_ENABLED: 'false'
          UPDATE_TASK: 'false'
          BATCH_UPDATE_ENABLED: 'false'
          NODE_TYPE: slave
          TZ: Asia/Taipei
        run: |
          "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" migrate --up
          "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" migrate --check

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Run Advanced Settings real-backend Wave 2
        working-directory: web/default
        env:
          QA_BINARY: ${{ runner.temp }}/renewapi-settings-phase-e-wave2
          QA_DB: ${{ runner.temp }}/renewapi-settings-phase-e-wave2.db
          QA_OUT: ../../qa-artifacts/settings-advanced-phase-e-wave2
          QA_PORT: '4173'
        run: bun ../../.github/settings-advanced-phase-e-wave2.mjs

      - name: Show Wave 2 summary
        if: always()
        run: |
          cat qa-artifacts/settings-advanced-phase-e-wave2/summary.txt || true
          cat qa-artifacts/settings-advanced-phase-e-wave2/failure.json || true

      - name: Upload Wave 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-advanced-phase-e-wave2
          path: qa-artifacts/settings-advanced-phase-e-wave2
          if-no-files-found: error
