name: Settings Advanced Phase E Wave 2

on:
  push:
    branches:
      - main
    paths:
      - '.github/settings-advanced-phase-e-wave2.mjs'
      - '.github/workflows/settings-advanced-phase-e-wave2.yml'
      - 'controller/option.go'
      - 'controller/option_validation.go'
      - 'controller/option_validation_test.go'
      - 'controller/request_guard.go'
      - 'controller/request_guard_test.go'
      - 'model/log.go'
      - 'model/log_index_test.go'
      - 'model/option.go'
      - 'model/option_rollback_test.go'
      - 'service/requestguard/**'
      - 'setting/operation_setting/request_guard_setting.go'
      - 'setting/ratio_setting/**'
      - 'web/default/src/features/system-settings/hooks/use-settings-form.ts'
      - 'web/default/src/features/system-settings/hooks/use-update-option.ts'
      - 'web/default/src/features/system-settings/maintenance/log-settings-section.tsx'
      - 'web/default/src/features/system-settings/models/**'
      - 'web/default/src/features/system-settings/security/anti-poison-guard-section.tsx'
      - 'web/default/src/features/system-settings/security/request-guard-*.ts*'
      - 'web/default/src/features/system-settings/security/request-guard-section.tsx'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: settings-advanced-phase-e-wave2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-backend-wave2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Publish Wave 2 pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -nc \
            --arg state 'pending' \
            --arg target_url "$target_url" \
            --arg description "Wave 2 run $GITHUB_RUN_ID started" \
            --arg context 'settings-advanced-phase-e-wave2' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Wave 2 backend regressions
        run: >-
          go test -count=1
          -run 'TestUpdateRequestGuardConfigClearsRemovedEndpointSecret|TestUpdateRequestGuardConfigRejectsInvalidPayloadWithoutMutation|TestGetOptionsMasksAntiPoisonAuditSecretAndReportsConfiguredState|TestDeleteOldLogRespectsCutoffAndPreservesNewerRows|TestUpdateOptionsBulkRollbackRemovesRuntimeKeyMissingFromSnapshot'
          ./controller ./model

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Build classic frontend
        working-directory: web/classic
        run: |
          if ! bun install --frozen-lockfile; then
            bun pm cache rm
            bun install --frozen-lockfile
          fi
          bun run build

      - name: Build real RenewAPI binary
        run: go build -o "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" .

      - name: Bootstrap fresh SQLite with production migrations
        env:
          SQLITE_PATH: ${{ runner.temp }}/renewapi-settings-phase-e-wave2.db
          SESSION_SECRET: settings-advanced-phase-e-wave2-2026-08-24
          GIN_MODE: release
          DEBUG: 'false'
          MEMORY_CACHE_ENABLED: 'false'
          OFFICIAL_PRICE_SYNC_ENABLED: 'false'
          UPDATE_TASK: 'false'
          BATCH_UPDATE_ENABLED: 'false'
          NODE_TYPE: slave
          TZ: Asia/Taipei
        run: |
          "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" migrate --up
          "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" migrate --check

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium
          cp ../../.github/settings-advanced-phase-e-wave2.mjs .settings-advanced-phase-e-wave2.mjs
          sed -i "s/getByLabel('Model')/getByLabel('Model', { exact: true })/g" .settings-advanced-phase-e-wave2.mjs
          sed -i "s/getByLabel('Group ratios')/getByLabel('Group ratios', { exact: true })/g" .settings-advanced-phase-e-wave2.mjs

      - name: Run Advanced Settings real-backend Wave 2
        working-directory: web/default
        env:
          QA_BINARY: ${{ runner.temp }}/renewapi-settings-phase-e-wave2
          QA_DB: ${{ runner.temp }}/renewapi-settings-phase-e-wave2.db
          QA_OUT: ../../qa-artifacts/settings-advanced-phase-e-wave2
          QA_PORT: '4173'
        run: bun .settings-advanced-phase-e-wave2.mjs

      - name: Verify Wave 2 evidence redaction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence='qa-artifacts/settings-advanced-phase-e-wave2'
          if [[ ! -d "$evidence" ]]; then
            exit 0
          fi
          if grep -R -q -F \
            -e 'wave2-request-guard-secret' \
            -e 'wave2-audit-secret-initial' \
            -e 'wave2-audit-secret-rotated' \
            "$evidence"; then
            rm -rf "$evidence"
            printf '%s\n' 'Wave 2 evidence contained a QA secret and was removed before upload.'
            exit 1
          fi

      - name: Show Wave 2 summary
        if: always()
        run: |
          cat qa-artifacts/settings-advanced-phase-e-wave2/summary.txt || true
          cat qa-artifacts/settings-advanced-phase-e-wave2/failure.json || true

      - name: Upload Wave 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-advanced-phase-e-wave2
          path: qa-artifacts/settings-advanced-phase-e-wave2
          if-no-files-found: error

      - name: Publish Wave 2 final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state='success' ;;
            cancelled) state='error' ;;
            *) state='failure' ;;
          esac
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -nc \
            --arg state "$state" \
            --arg target_url "$target_url" \
            --arg description "Wave 2 run $GITHUB_RUN_ID: $state" \
            --arg context 'settings-advanced-phase-e-wave2' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
