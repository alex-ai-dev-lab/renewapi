name: Settings Advanced Phase E Wave 2

on:
  workflow_call:

permissions:
  contents: read

jobs:
  real-backend-wave2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Wave 2 backend regressions
        run: >-
          go test -count=1
          -run 'TestUpdateRequestGuardConfigClearsRemovedEndpointSecret|TestUpdateRequestGuardConfigRejectsInvalidPayloadWithoutMutation|TestGetOptionsMasksAntiPoisonAuditSecretAndReportsConfiguredState|TestDeleteOldLogRespectsCutoffAndPreservesNewerRows|TestUpdateOptionsBulkRollbackRemovesRuntimeKeyMissingFromSnapshot'
          ./controller ./model

      - name: Verify default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Build classic frontend
        working-directory: web/classic
        run: |
          if ! bun install --frozen-lockfile; then
            bun pm cache rm
            bun install --frozen-lockfile
          fi
          bun run build

      - name: Build real RenewAPI binary
        run: go build -o "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" .

      - name: Bootstrap fresh SQLite with production migrations
        env:
          SQLITE_PATH: ${{ runner.temp }}/renewapi-settings-phase-e-wave2.db
          SESSION_SECRET: settings-advanced-phase-e-wave2-2026-08-24
          GIN_MODE: release
          DEBUG: 'false'
          MEMORY_CACHE_ENABLED: 'false'
          OFFICIAL_PRICE_SYNC_ENABLED: 'false'
          UPDATE_TASK: 'false'
          BATCH_UPDATE_ENABLED: 'false'
          NODE_TYPE: slave
          TZ: Asia/Taipei
        run: |
          "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" migrate --up
          "$RUNNER_TEMP/renewapi-settings-phase-e-wave2" migrate --check

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium
          cp ../../.github/settings-advanced-phase-e-wave2.mjs .settings-advanced-phase-e-wave2.mjs
          sed -i "s/getByLabel('Model')/getByLabel('Model', { exact: true })/g" .settings-advanced-phase-e-wave2.mjs
          sed -i "s/getByLabel('Group ratios')/getByLabel('Group ratios', { exact: true })/g" .settings-advanced-phase-e-wave2.mjs

      - name: Run Advanced Settings real-backend Wave 2
        working-directory: web/default
        env:
          QA_BINARY: ${{ runner.temp }}/renewapi-settings-phase-e-wave2
          QA_DB: ${{ runner.temp }}/renewapi-settings-phase-e-wave2.db
          QA_OUT: ../../qa-artifacts/settings-advanced-phase-e-wave2
          QA_PORT: '4173'
        run: bun .settings-advanced-phase-e-wave2.mjs

      - name: Verify Wave 2 evidence redaction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence='qa-artifacts/settings-advanced-phase-e-wave2'
          if [[ ! -d "$evidence" ]]; then
            exit 0
          fi
          if grep -R -q -F \
            -e 'wave2-request-guard-secret' \
            -e 'wave2-audit-secret-initial' \
            -e 'wave2-audit-secret-rotated' \
            "$evidence"; then
            rm -rf "$evidence"
            printf '%s\n' 'Wave 2 evidence contained a QA secret and was removed before upload.'
            exit 1
          fi

      - name: Show Wave 2 summary
        if: always()
        run: |
          cat qa-artifacts/settings-advanced-phase-e-wave2/summary.txt || true
          cat qa-artifacts/settings-advanced-phase-e-wave2/failure.json || true

      - name: Upload Wave 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-advanced-phase-e-wave2
          path: qa-artifacts/settings-advanced-phase-e-wave2
          if-no-files-found: error
