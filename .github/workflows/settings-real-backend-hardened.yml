name: Settings real backend hardened smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: settings-real-backend-hardened-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Build classic frontend
        working-directory: web/classic
        run: |
          if ! bun install --frozen-lockfile; then
            bun pm cache rm
            bun install --frozen-lockfile
          fi
          bun run build

      - name: Verify authoritative frontend default and classic override
        run: go test -count=1 -run 'TestThemeDefaultsToRedesignedFrontend|TestThemeSyncPreservesClassicOverride' ./setting/system_setting

      - name: Build real RenewAPI binary
        run: go build -o "$RUNNER_TEMP/renewapi-settings-hardened" .

      - name: Bootstrap fresh SQLite with production migrations
        env:
          SQLITE_PATH: ${{ runner.temp }}/renewapi-settings-hardened.db
          SESSION_SECRET: settings-real-backend-hardened-2026-08-23-4c2d5d1a7f6b88e3
          GIN_MODE: release
          DEBUG: 'false'
          MEMORY_CACHE_ENABLED: 'false'
          OFFICIAL_PRICE_SYNC_ENABLED: 'false'
          UPDATE_TASK: 'false'
          BATCH_UPDATE_ENABLED: 'false'
          NODE_TYPE: slave
          TZ: Asia/Taipei
        run: |
          "$RUNNER_TEMP/renewapi-settings-hardened" migrate --up
          "$RUNNER_TEMP/renewapi-settings-hardened" migrate --check

      - name: Install Playwright for QA only
        working-directory: web/default
        run: |
          bun add --no-save playwright@1.55.0
          bunx playwright install --with-deps chromium

      - name: Run hardened real-backend Settings smoke
        working-directory: web/default
        env:
          QA_BINARY: ${{ runner.temp }}/renewapi-settings-hardened
          QA_DB: ${{ runner.temp }}/renewapi-settings-hardened.db
          QA_OUT: ../../qa-artifacts/settings-real-backend-hardened
          QA_PORT: '4173'
        run: |
          cp ../../.github/settings-real-backend-hardened.mjs .settings-real-backend-hardened.mjs
          bun .settings-real-backend-hardened.mjs

      - name: Show hardened smoke summary
        if: always()
        run: |
          cat qa-artifacts/settings-real-backend-hardened/summary.txt || true
          cat qa-artifacts/settings-real-backend-hardened/failure.json || true

      - name: Upload hardened real-backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-real-backend-hardened
          path: qa-artifacts/settings-real-backend-hardened
          if-no-files-found: error
