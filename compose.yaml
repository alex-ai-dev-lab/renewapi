services:
  new-api:
    image: ${NEWAPI_IMAGE:-ghcr.io/alex-ai-dev-lab/renewapi:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-newapi}-new-api
    restart: unless-stopped
    init: true
    ports:
      - "${NEWAPI_HOST_PORT:-3002}:${PORT:-3000}"
    volumes:
      - ${NEWAPI_DATA_DIR:-./data}:/data
      - ${NEWAPI_LOG_DIR:-./logs}:/app/logs
      - ${NEWAPI_PUBLIC_DIR:-./public}:/app/public
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SQL_DSN: ${SQL_DSN:-}
      SQLITE_SEPARATE_LOG_DB: ${SQLITE_SEPARATE_LOG_DB:-true}
      SQLITE_LOG_MAX_OPEN_CONNS: ${SQLITE_LOG_MAX_OPEN_CONNS:-4}
      SQLITE_LOG_MAX_IDLE_CONNS: ${SQLITE_LOG_MAX_IDLE_CONNS:-4}
      PORT: ${PORT:-3000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set to a strong random value, e.g. `openssl rand -hex 32`}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-newapi-1}
      STREAMING_TIMEOUT: ${STREAMING_TIMEOUT:-300}
      OFFICIAL_PRICE_SYNC_ENABLED: ${OFFICIAL_PRICE_SYNC_ENABLED:-true}
      RESPONSES_COMPACTION_ENFORCEMENT: ${RESPONSES_COMPACTION_ENFORCEMENT:-strict}
      RESPONSES_COMPACTION_MODEL: ${RESPONSES_COMPACTION_MODEL:-}
      RESPONSES_COMPACTION_PRECONSUME_FLOOR: ${RESPONSES_COMPACTION_PRECONSUME_FLOOR:-4096}
      RESPONSES_COMPACTION_MAX_ITEMS: ${RESPONSES_COMPACTION_MAX_ITEMS:-64}
      RESPONSES_COMPACTION_MAX_ENCRYPTED_BYTES: ${RESPONSES_COMPACTION_MAX_ENCRYPTED_BYTES:-8388608}
      RESPONSES_COMPACTION_PROBE_ENABLED: ${RESPONSES_COMPACTION_PROBE_ENABLED:-false}
      RESPONSES_COMPACTION_PROBE_MAX_MODELS: ${RESPONSES_COMPACTION_PROBE_MAX_MODELS:-4}
      RESPONSES_COMPACTION_ROUTE_PLAN_ENABLED: ${RESPONSES_COMPACTION_ROUTE_PLAN_ENABLED:-false}
      RESPONSES_COMPACTION_MAX_ROUTE_CANDIDATES: ${RESPONSES_COMPACTION_MAX_ROUTE_CANDIDATES:-12}
      RESPONSES_COMPACTION_CROSS_FAMILY_FALLBACK: ${RESPONSES_COMPACTION_CROSS_FAMILY_FALLBACK:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-3000}/api/status >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - newapi

